<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 18 846 402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #22363E; }
    .m { fill: #7A929A; } .f { fill: #AABDC3; } .a { fill: #0E7490; } .c { fill: #D65F4A; }
    .big { font-size: 18px; font-weight: 600; } .lab { font-size: 14px; } .sm { font-size: 12.5px; }
    .draw { stroke: #22363E; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-f { stroke: #AABDC3; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-a { stroke: #0E7490; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .draw-c { stroke: #D65F4A; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dash { stroke-dasharray: 5 6; }
    .fill-soft { fill: #E7F2F4; }
  </style>
  <defs>
    <marker id="h-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#22363E"/>
    </marker>
    <marker id="h-faint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#AABDC3"/>
    </marker>
    <marker id="h-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E7490"/>
    </marker>
    <marker id="h-cor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D65F4A"/>
    </marker>
  </defs>

  <line x1="440" y1="30" x2="440" y2="374" class="draw-f dash" stroke-width="1.5"/>
  <circle cx="440" cy="200" r="20" fill="#FFFFFF" stroke="#DDE8EA" stroke-width="1.5"/>
  <text x="440" y="205" text-anchor="middle" class="sm m" font-weight="600">vs</text>

  <!-- LEFT: an ordinary agent -->
  <text x="220" y="42" text-anchor="middle" class="lab m" font-weight="600" font-size="15.5">an ordinary agent</text>

  <g class="draw-f">
    <circle cx="80" cy="112" r="10"/>
    <line x1="80" y1="122" x2="80" y2="156"/>
    <line x1="80" y1="134" x2="66" y2="146"/>
    <line x1="80" y1="134" x2="94" y2="146"/>
    <line x1="80" y1="156" x2="68" y2="176"/>
    <line x1="80" y1="156" x2="92" y2="176"/>
  </g>

  <rect x="250" y="98" width="112" height="54" rx="10" class="draw-f"/>
  <text x="306" y="122" text-anchor="middle" class="lab m">agent</text>
  <text x="306" y="140" text-anchor="middle" class="sm f">never changes</text>

  <path d="M108 112 H242" class="draw-f" marker-end="url(#h-faint)"/>
  <text x="175" y="104" text-anchor="middle" class="sm f">ask</text>
  <path d="M242 140 H112" class="draw-f" marker-end="url(#h-faint)"/>
  <text x="175" y="160" text-anchor="middle" class="sm f">answer</text>

  <rect x="48" y="222" width="122" height="30" rx="6" class="draw-f"/>
  <text x="109" y="242" text-anchor="middle" class="sm f">"that was wrong!"</text>
  <path d="M176 237 C 210 237, 226 248, 248 260" class="draw-f dash" marker-end="url(#h-faint)"/>

  <g class="draw-f">
    <rect x="260" y="246" width="46" height="52" rx="4"/>
    <line x1="252" y1="246" x2="314" y2="246"/>
    <line x1="276" y1="238" x2="290" y2="238"/>
    <line x1="273" y1="258" x2="273" y2="286"/>
    <line x1="283" y1="258" x2="283" y2="286"/>
    <line x1="293" y1="258" x2="293" y2="286"/>
  </g>
  <text x="283" y="316" text-anchor="middle" class="sm f">(gone forever)</text>

  <g>
    <path d="M 160 330 V 372 H 288" class="draw-f" stroke-width="1.5"/>
    <path d="M 170 352 H 280" class="draw-f dash"/>
  </g>

  <text x="220" y="404" text-anchor="middle" class="big f">…nothing is ever learned</text>

  <!-- RIGHT: with Reef -->
  <text x="660" y="42" text-anchor="middle" class="lab a" font-weight="600" font-size="15.5">with Reef</text>

  <g class="draw">
    <circle cx="472" cy="112" r="10"/>
    <line x1="472" y1="122" x2="472" y2="156"/>
    <line x1="472" y1="134" x2="458" y2="146"/>
    <line x1="472" y1="134" x2="486" y2="146"/>
    <line x1="472" y1="156" x2="460" y2="176"/>
    <line x1="472" y1="156" x2="484" y2="176"/>
  </g>

  <rect x="528" y="74" width="162" height="124" rx="14" class="draw"/>
  <text x="609" y="96" text-anchor="middle" class="sm" font-weight="600">agent</text>
  <rect x="540" y="110" width="64" height="66" rx="9" class="draw"/>
  <text x="572" y="148" text-anchor="middle" class="sm">model</text>
  <rect x="616" y="110" width="62" height="66" rx="9" class="draw"/>
  <text x="647" y="148" text-anchor="middle" class="sm">harness</text>

  <path d="M494 110 H520" class="draw" marker-end="url(#h-ink)"/>
  <path d="M520 140 H500" class="draw" marker-end="url(#h-ink)"/>

  <rect x="716" y="94" width="158" height="224" rx="14" class="draw-a fill-soft"/>
  <text x="795" y="120" text-anchor="middle" class="lab a" font-weight="600">reef</text>

  <path d="M692 118 H710" class="draw" marker-end="url(#h-ink)"/>

  <g class="draw-f" transform="translate(10,-9)" opacity="0.55">
    <path d="M752 150 h30 v34 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 z"/>
  </g>
  <g class="draw-a">
    <path d="M752 150 h30 v34 l-5 -4 l-5 4 l-5 -4 l-5 4 l-5 -4 l-5 4 z"/>
    <line x1="759" y1="160" x2="775" y2="160"/>
    <line x1="759" y1="168" x2="775" y2="168"/>
  </g>
  <text x="828" y="170" text-anchor="middle" class="sm a">receipts</text>

  <path d="M 795 200 V 232" class="draw-a" marker-end="url(#h-acc)"/>
  <text x="805" y="220" class="sm a" font-style="italic">recipe</text>

  <g>
    <circle cx="752" cy="260" r="12" class="draw-f"/>
    <text x="752" y="265" text-anchor="middle" class="sm f">v1</text>
    <path d="M768 260 H778" class="draw-f" marker-end="url(#h-faint)"/>
    <circle cx="794" cy="260" r="12" class="draw-f"/>
    <text x="794" y="265" text-anchor="middle" class="sm f">v2</text>
    <path d="M810 260 H820" class="draw" marker-end="url(#h-ink)"/>
    <circle cx="836" cy="260" r="12" class="draw-a"/>
    <text x="836" y="265" text-anchor="middle" class="sm a" font-weight="600">v3</text>
  </g>

  <path d="M472 190 C 472 280, 570 306, 706 292" class="draw-a" marker-end="url(#h-acc)"/>
  <text x="528" y="330" text-anchor="middle" class="sm a">"wrong!"</text>
  <text x="528" y="346" text-anchor="middle" class="sm a">pin to #7</text>

  <path d="M 736 248 C 700 236, 668 214, 650 184" class="draw-c" marker-end="url(#h-cor)"/>
  <path d="M 736 266 C 650 274, 592 236, 576 184" class="draw-c" marker-end="url(#h-cor)"/>

  <g>
    <path d="M 596 330 V 372 H 724" class="draw" stroke-width="1.5"/>
    <path d="M 604 366 H 628 L 632 356 H 654 L 658 346 H 680 L 684 338 H 700" class="draw-a"/>
    <path d="M 700 338 L 716 331" class="draw-c" marker-end="url(#h-cor)"/>
  </g>

  <text x="660" y="404" text-anchor="middle" class="big a">…it just keeps getting better</text>
</svg>
