@page{size:1920px 1080px;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#ece9e4}
#deck{width:1920px;margin:0 auto;transform-origin:top left}
.page{width:1920px;height:1080px;overflow:hidden;background:#ffffff;page-break-after:always;break-after:page}
.page+.page{margin-top:24px}
@media print{html,body{background:#fff;height:auto!important}.page+.page{margin-top:0}#p3{page-break-after:auto;break-after:auto}#deck{transform:none!important;margin:0!important}}
svg{display:block}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleX(1)}}
@keyframes mv{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(var(--dx));opacity:0}}
.f{opacity:0;animation:fade .5s ease-out both}
.d{--len:400;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .9s ease-in-out both}
.g{transform:scaleX(0);transform-box:fill-box;transform-origin:left center;animation:grow 1.4s ease-out both}
.mv{opacity:0;animation:mv 1.3s ease-in-out both}
@media print,(prefers-reduced-motion:reduce){

}
