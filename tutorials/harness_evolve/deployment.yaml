# Run from the repository root:
# reef serve -c tutorials/harness_evolve/deployment.yaml
# This is the long-running pi deployment used by the root README. The separate
# serve.yaml and serve-native.yaml files remain inputs to the short-lived
# ./run.sh demo for its pi and native variants.
implementation: reef.train.cordis_backend.recipe:CordisRecipe
model:
  path: &model your-model-name  # Set once; shared by serving and evaluation.

evolution:
  adapter: pi
  propose: harness.evolution:propose
  evaluate: harness.evolution:evaluate
  # No binary: at startup reef installs the descriptor's pinned pi under
  # ~/.local/share/reef-harness/pi, shared with the client install script.
  # Set evolution.binary to a path to use an install of your own instead.
  tasks:
  - '[sieve] Write and mentally run a prime sieve: how many primes are below 100000?
    Reply with the count as a plain integer alone on the last line.'
  - '[fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly (memoize, do not
    approximate). Reply with the value as a plain integer alone on the last line.'
  - '[csv] Compute the median of the value column in this csv:

    id,value

    1,12

    2,47

    3,3

    4,88

    5,21

    6,56

    7,9

    8,74

    9,30

    Reply with the median as a plain integer alone on the last line.'
  seed:
  - id: answer-style
    name: skill
    config:
      name: answer-style
      text: '# answer-style


        Starter skill. The evolution loop replaces this placeholder with

        concrete guidance learned from failing tasks.

        '
data:
  batch_size: 1
  max_score: 0.0

reef:
  host: 127.0.0.1
  port: 8901
  recipe: deployment
  token: reef-local
  upstream_url: ${REEF_UPSTREAM_URL}
  upstream_model: *model
  upstream_api_key: ${REEF_UPSTREAM_API_KEY}
  agent_record_dir: tutorials/harness_evolve/work/deployment/agent-record
  artifact_repository: tutorials/harness_evolve/work/deployment/artifacts.git
  artifact_work_dir: tutorials/harness_evolve/work/deployment/artifact-work
  artifact_cache_dir: tutorials/harness_evolve/work/deployment/artifact-cache

run_dir: tutorials/harness_evolve/work/deployment/stack

services:
  - name: reef
    command: ["${REEF_PYTHON}", "-m", "reef.service"]
    env:
      REEF_RECIPE_CONFIG_DIR: tutorials/harness_evolve
      PYTHONPATH: "${PWD}/tutorials/harness_evolve:${PWD}"
    ready: curl -sf http://127.0.0.1:${reef.port}/healthz
