# The stack `run.sh` starts: one Reef service on port 8900, state under
# the example's ./work directory.
#
# This file also carries the harness_evolve recipe sections (implementation, model,
# evolution, data). The recipe registry reads named recipe configs from
# REEF_RECIPE_CONFIG_DIR, so run.sh copies those four sections into
# work/recipes/harness_evolve.yaml.

implementation: reef.harness_evolve.recipe:HarnessEvolveRecipe

model:
  path: qwen3-8b

evolution:
  adapter: pi
  # The method package beside this file (harness/): the reef service resolves
  # these dotted references because run.sh starts it with this cwd.
  propose: harness.evolution:propose
  evaluate: harness.evolution:evaluate
  binary: pi  # the coding agent episodes run headless
  # Three exact-answer coding tasks. Each prefix keys the expected answer
  # in harness/evolution.py's answer table; each prompt pins the reply
  # format the grader checks (the answer alone on the last line).
  tasks:
    - >-
      [sieve] Write and mentally run a prime sieve: how many primes are
      below 100000? Reply with the count as a plain integer alone on the
      last line.
    - >-
      [fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly
      (memoize, do not approximate). Reply with the value as a plain
      integer alone on the last line.
    - |-
      [csv] Compute the median of the value column in this csv:
      id,value
      1,12
      2,47
      3,3
      4,88
      5,21
      6,56
      7,9
      8,74
      9,30
      Reply with the median as a plain integer alone on the last line.
  # The first-boot composition. It carries no provider: Reef renders its
  # own model binding (reef.upstream_url / reef.upstream_model below) into each
  # evaluation episode, and the published tree never names an endpoint.
  # The starter skill gives the proposer a node to improve.
  seed:
    - id: answer-style
      name: skill
      config:
        name: answer-style
        text: |
          # answer-style

          Starter skill. The evolution loop replaces this placeholder with
          concrete guidance learned from failing tasks.

data:
  # One evolve step per report; only failing traffic (score <= 0.0)
  # batches - the SkillClaw move: learn from failures.
  batch_size: 1
  max_score: 0.0

reef:
  host: 127.0.0.1
  port: 8900
  recipe: harness_evolve
  token: reef-local
  # The OpenAI-compatible provider (no /v1 suffix) and the model under test.
  # Reef proxies recorded traffic here, the proposer's calls go here, and
  # evaluation episodes are pointed here - nothing else ever sees it.
  upstream_url: http://127.0.0.1:8000
  upstream_api_key: ${REEF_UPSTREAM_API_KEY}
  upstream_model: qwen3-8b
  agent_record_dir: work/agent-record
  artifact_repository: work/artifacts.git
  artifact_work_dir: work/artifact-work
  artifact_cache_dir: work/artifact-cache

run_dir: work/stack

services:
  - name: reef
    command: python3 -m reef.service
    ready: curl -sf http://127.0.0.1:${reef.port}/healthz
