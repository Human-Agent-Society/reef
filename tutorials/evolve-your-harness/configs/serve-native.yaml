# The same stack as serve.yaml on reef's native harness: `./run.sh native`.
# The loop's tools and loop hooks are files of the tree, so the method may
# change what the agent can do, not only what it is told.

reef:
  host: 127.0.0.1
  port: 8900
  # Unset REEF_TOKEN leaves this loopback demo without authentication; set it to require a Bearer token.
  token: ${REEF_TOKEN}
  # The OpenAI-compatible provider (no /v1 suffix) and the model under test.
  run-dir: work/stack

recipe:
  implementation: reef.recipe.harness:HarnessEvolutionRecipe

  config:
    evolution:
      adapter: native
      # The default pipeline stages batch every valid scored report, a passing one included.
      # batch_size 1 makes each report one evolve step.
      batch_size: 1
      # The native variant of the method beside this file (harness/plugins.py):
      # one call to the served model turns the failing traces into one change
      # of a skill, tool, hook, agent or the loop graph.
      method: tutorials.evolve-your-harness.harness.plugins:NativeMethod
      # No binary: the native loop is reef's own. run.sh puts a reef-native
      # launcher for this checkout on PATH; an installed reef ships the script.
      # The first tree, a directory relative to the one run.sh starts Reef in: the loop's starter tools
      # (read_file, write_file, run_bash, execute), its loop guard hook and main
      # graph, which the method may retune or replace, plus the starter skill.
      # It carries no provider: Reef renders its own model binding into each
      # evaluation rollout.
      seed: seeds/native
      # Each scenario's proposals, history (the score cache) and step records,
      # relative to the directory run.sh starts Reef in, as every path in this file is.
      state_dir: work/harness
      evaluation:
        # The same grader as the pi variant, over the native trajectory.
        scorer: tutorials.evolve-your-harness.harness.plugins:NativeAnswerScorer
        policy: compare
        # The pi variant's three tasks, so the two runs are comparable.
        tasks:
          - >-
            [sieve] Write and mentally run a prime sieve: how many primes are below 100000? Reply with the count as a
            plain integer alone on the last line.
          - >-
            [fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly (memoize, do not approximate). Reply with the
            value as a plain integer alone on the last line.
          - |-
            [csv] Compute the median of the value column in this csv:
            id,value
            1,12
            2,47
            3,3
            4,88
            5,21
            6,56
            7,9
            8,74
            9,30
            Reply with the median as a plain integer alone on the last line.

    # The default: nobody asks in this demo, and auto refuses POST /reef/train.
    training-mode: auto

inference:
  upstream-url: http://127.0.0.1:8000
  upstream-api-key: ${REEF_UPSTREAM_API_KEY}
  upstream-model: qwen3-8b
storage:
  agent-record-dir: work/agent-record
  artifact-repository: work/artifacts.git
  artifact-work-dir: work/artifact-work
  artifact-cache-dir: work/artifact-cache

execution:
  evolution:
    workers: 1  # Auto selects uni for one CPU worker, mp for multiple workers.
