# Run from the repository root:
# reef serve -c tutorials/evolve-your-harness/configs/deployment.yaml
# This is the long-running pi deployment used by the root README. The separate
# serve.yaml and serve-native.yaml files remain inputs to the short-lived
# ./run.sh demo for its pi and native variants.
schema-version: 2
reef:
  host: 127.0.0.1
  port: 8901
  token: reef-local
  run-dir: tutorials/evolve-your-harness/work/deployment/stack

recipe:
  implementation: reef.recipe.cordis:CordisRecipe
  # The recipe uses the upstream runtime's model for evaluation as well as serving.
  config:
    evolution:
      adapter: pi
      propose: tutorials.evolve-your-harness.harness.evolution:propose
      evaluate: tutorials.evolve-your-harness.harness.evolution:evaluate
      # The seed carries the /reef-harness command and the pi extension API skill the proposer reads.
      requests: true
      # The notice at session start offers the update once the head moved.
      version_check: true
      # An evolved extension runs in pi's process with your privileges, so it waits for a promote.
      review_kinds: [code_extension]
      # No binary: at startup reef installs the descriptor's pinned pi under
      # ~/.local/share/reef-harness/pi, shared with the client install script.
      # Set evolution.binary to a path to use an install of your own instead.
      tasks:
        - '[sieve] Write and mentally run a prime sieve: how many primes are below 100000? Reply with the count as a plain
          integer alone on the last line.'
        - '[fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly (memoize, do not approximate). Reply with the value
          as a plain integer alone on the last line.'
        - '[csv] Compute the median of the value column in this csv:

          id,value

          1,12

          2,47

          3,3

          4,88

          5,21

          6,56

          7,9

          8,74

          9,30

          Reply with the median as a plain integer alone on the last line.'
      seed:
        - id: answer-style
          name: skill
          config:
            name: answer-style
            text: '# answer-style


              Starter skill. The evolution loop replaces this placeholder with

              concrete guidance learned from failing tasks.

              '
    batch-size: 1
    max-score: 0.0
    # The person asks with POST /reef/train while the deployment keeps learning from failures.
    training-mode: hybrid

inference:
  upstream-url: ${REEF_UPSTREAM_URL:?}
  upstream-model: ${REEF_UPSTREAM_MODEL:?}
  upstream-api-key: ${REEF_UPSTREAM_API_KEY}
storage:
  agent-record-dir: tutorials/evolve-your-harness/work/deployment/agent-record
  artifact-repository: tutorials/evolve-your-harness/work/deployment/artifacts.git
  artifact-work-dir: tutorials/evolve-your-harness/work/deployment/artifact-work
  artifact-cache-dir: tutorials/evolve-your-harness/work/deployment/artifact-cache

execution:
  evolution:
    workers: 1  # Auto selects uni for one CPU worker, mp for multiple workers.
