# The stack `run.sh` starts: one Reef service on port 8900, state under
# the example's ./work directory.
#
# This file also carries the harness_evolve recipe sections (implementation, model,
# evolution, data). The recipe registry reads named recipe configs from
# REEF_RECIPE_CONFIG_DIR, so run.sh copies those four sections into
# work/recipes/harness_evolve.yaml, together with optional execution/executors sections.

schema-version: 2
reef:
  host: 127.0.0.1
  port: 8900
  token: reef-local
  # The OpenAI-compatible provider (no /v1 suffix) and the model under test.
  # Reef proxies recorded traffic here, the proposer's calls go here, and
  # evaluation episodes are pointed here - nothing else ever sees it.
  run-dir: work/stack

recipe:
  implementation: reef.recipe.cordis:CordisRecipe

  config:
    evolution:
      adapter: pi
      # The method package beside this file (harness/): the reef service resolves
      # these dotted references because run.sh starts it with this cwd.
      propose: tutorials.evolve-your-harness.harness.evolution:propose
      evaluate: tutorials.evolve-your-harness.harness.evolution:evaluate
      # No binary: at startup reef installs the descriptor's pinned pi under
      # ~/.local/share/reef-harness/pi, shared with the client install script.
      # Set evolution.binary to a path to use an install of your own instead.
      # Three exact-answer coding tasks. Each prefix keys the expected answer
      # in harness/evolution.py's answer table; each prompt pins the reply
      # format the grader checks (the answer alone on the last line).
      tasks:
        - >-
          [sieve] Write and mentally run a prime sieve: how many primes are below 100000? Reply with the count as a plain
          integer alone on the last line.
        - >-
          [fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly (memoize, do not approximate). Reply with the value
          as a plain integer alone on the last line.
        - |-
          [csv] Compute the median of the value column in this csv:
          id,value
          1,12
          2,47
          3,3
          4,88
          5,21
          6,56
          7,9
          8,74
          9,30
          Reply with the median as a plain integer alone on the last line.
      # The first-boot composition. It carries no provider: Reef renders its
      # own model binding (reef.upstream_url / reef.upstream_model below) into each
      # evaluation episode, and the published tree never names an endpoint.
      # The starter skill gives the proposer a node to improve.
      seed:
        - id: answer-style
          name: skill
          config:
            name: answer-style
            text: |
              # answer-style

              Starter skill. The evolution loop replaces this placeholder with
              concrete guidance learned from failing tasks.

    batch-size: 1
    max-score: 0.0
    # The default: nobody asks in this demo, and auto refuses POST /reef/train.
    training-mode: auto

inference:
  upstream-url: http://127.0.0.1:8000
  upstream-api-key: ${REEF_UPSTREAM_API_KEY}
  upstream-model: qwen3-8b
storage:
  agent-record-dir: work/agent-record
  artifact-repository: work/artifacts.git
  artifact-work-dir: work/artifact-work
  artifact-cache-dir: work/artifact-cache

execution:
  evolution:
    workers: 1  # Auto selects uni for one CPU worker, mp for multiple workers.
