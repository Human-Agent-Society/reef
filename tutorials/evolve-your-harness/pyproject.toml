[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-harness-evolve-method"
version = "0.1.0"
description = "The evolve-your-harness tutorial's methods and graders for Reef harness evolution"
requires-python = ">=3.10"
dependencies = ["reef-client"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]

# plugins.py and native_evolution.py read their prompts from these files at import.
[tool.setuptools.package-data]
harness = ["*.md"]
