# The harness tree Hermes Agent takes. A method writes each part at its path;
# Reef checks the file as its format and renders it to its renders path,
# inside the hermes home of an episode or of an install. A tree file that no
# part takes is refused.
parts:
  # hermes reads one home level rules file, SOUL.md; AGENTS.md is project
  # scoped and read from the working directory chain, never from the home.
  rules:
    path: rules.md
    format: text
    renders: hermes/SOUL.md
    holds: the instructions hermes reads at the start of every session
  skill:
    path: skills/{name}/SKILL.md
    format: skill
    renders: hermes/skills/{name}/SKILL.md
    holds: an Agent Skill, which hermes loads when its description fits the task
  # Every skill is also a /name command in the interactive CLI, and hermes has
  # no other command surface, so a command is a skill under a second root.
  # The quirks module adds that root to skills.external_dirs, beside the home
  # for an episode and at the install root for a reef-hermes session.
  command:
    path: commands/{name}.md
    format: command
    renders: hermes-commands/{name}/SKILL.md
    holds: a prompt template that a person runs as /name, rendered as a skill under a second root
  # A hermes plugin: register(ctx) in the package init; the quirks module adds
  # the manifest and the config grants.
  extension:
    path: extensions/{name}.py
    format: code
    renders: hermes/plugins/{name}/__init__.py
    holds: a Python plugin package that hermes loads in its process
  config:
    path: config/{name}.json
    format: config
    holds: a JSON object merged into hermes/config.yaml (primary) or hermes/.env (env)
