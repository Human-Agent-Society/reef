# Terminal-Bench's Terminus 2, driven through a Reef-owned runner.
#
# Terminus 2 is not a binary that takes a prompt: it is a Harbor agent class
# that Harbor runs against a task container. The ``reef-terminus`` console
# script is that runner. It reads the rendered tree from REEF_TERMINUS_DIR,
# hands it to Harbor's own terminus-2 agent as native configuration, runs the
# task, and writes the verifier's reward and the ATIF trajectory under
# REEF_TERMINUS_SESSION_DIR.
#
# The prompt is the task: a Harbor task directory or a registry id, which is
# what reef-eval resolves. An episode therefore needs no dataset location in
# its environment, which run_episode would not have carried anyway - it hands
# an episode only the descriptor's own env and host_env, and {root}/{prompt}
# are the only substitutions in env and argv.
#
# Evolved Python requires Reef's sandbox around this runner and remote E2B
# tasks. Declarative trees can use the default local runner with Docker.
name: terminus
binary: reef-terminus
is_prompt_task_directory: true
argv:
  - --task
  - "{prompt}"
env:
  # The episode root, not the terminus directory: terminus-commands is a
  # sibling of terminus, so the runner reads the tree from one level up.
  REEF_TERMINUS_DIR: "{root}"
  REEF_TERMINUS_SESSION_DIR: "{root}/terminus/sessions"
  REEF_TERMINUS_TRIALS_DIR: "{root}/terminus/trials"
  HOME: "{root}/workspace"
# Harbor drives the task container with the docker CLI, which finds its
# endpoint and context through these variables, else through the current
# context in its config directory (colima and Docker Desktop set one there),
# where it also finds the compose plugin. HOME is relocated above, so the
# episode keeps the service's own values; {home} is the service's home.
host_env:
  DOCKER_HOST: ""
  DOCKER_CONTEXT: ""
  DOCKER_CONFIG: "{home}/.docker"
# Harbor bind-mounts each trial's directories under the root into the task
# container, so the root must be on a path Docker shares with the host. Linux
# Docker shares every path, and colima and Docker Desktop share the home
# directory by default; colima does not share $TMPDIR (/var/folders on
# macOS), and container writes there never reach the host.
is_root_under_home: true
files:
  config:
    primary:
      path: "terminus/config.json"
      defaults: {}
  rules: "terminus/AGENTS.md"
  # Terminus 2 has no slash-command surface, so an agent_command is a skill in
  # a second root. Harbor loads both roots and keeps its progressive skill
  # loading, so a command is discovered rather than pasted into the prompt.
  agent_command: "terminus-commands/{name}/SKILL.md"
  skill: "terminus/skills/{name}/SKILL.md"
  # One module exporting Agent(Terminus2), imported only inside Reef's jail.
  code_extension: "terminus/context/{name}.py"
trajectory:
  format: terminus-atif-json
  path: "terminus/sessions"
cleanup_whitelist:
  - "terminus/sessions/**"
  # Harbor writes its trial tree here: logs, the container's outputs, and the
  # ATIF trajectory the runner reads back.
  - "terminus/trials/**"
writable_paths:
  - "terminus/sessions"
  - "terminus/trials"
# The execution quirk permits nesting only with remote task environments.
self_isolating: true
quirks: reef.harness.adapters.terminus.quirks
# Terminus 2 reaches the model through litellm, so the binding is the provider
# base URL, key, and model name. The served tree never carries a provider.
# custom_openai sends the model to api_base as it is named whatever vendor
# prefix it carries: without it a bare "qwen/qwen3-coder" has no litellm
# provider, and "deepseek/..." goes to litellm's DeepSeek client without its
# vendor prefix. model_name stays the served name, the one Harbor looks up in
# litellm's model table for the context limit Terminus 2 summarizes against.
# litellm drops reasoning_effort for custom_openai unless it is allowed, and a
# tree may set it.
# A tree a person runs against Reef itself also needs llm_kwargs.extra_headers
# {"x-reef-scenario": "<scenario>"}, or Reef answers 400. Evaluation episodes
# call the upstream directly and need no header.
model_binding:
  openai:
    - target: primary
      data:
        model_name: "{model}"
        api_base: "{base_url}/v1"
        llm_kwargs:
          api_key: "{api_key}"
          custom_llm_provider: "custom_openai"
          allowed_openai_params: ["reasoning_effort"]
