# DeepSeek Harness (dsh), driven headless per run.
#
# DSH_HOME relocates the whole harness home (the headless and web profiles
# and their patch layers, sessions, storages, the user AGENTS.md and skills)
# under the run root, and DSH_AGENTS_HOME relocates the second skill
# root, where commands render as user invocable skills (dsh has
# no other command surface). DSH_TELEMETRY_MODE stops the OTLP session
# telemetry. The default workspace-write permission runs tools inside the
# working directory with no approval prompt, so no danger mode is needed.
# The profile patch is a YAML list of plugin entries; config nodes write it
# as an object keyed by plugin id and the renderer emits the list.
name: dsh
binary: dsh
# The vendor's install channel at the pinned version. Harness evolution startup
# installs it for the runs unless evolution.binary names a binary. The pin
# follows the alpha tag: the source line that was mapped and the binary that
# was measured.
install:
  kind: npm
  package: "@deepseek-ai/dsh"
  version: "0.1.2-alpha.5"
  binary_path: "node_modules/.bin/dsh"
renderer: reef.harness.adapters.dsh.render:DshAdapterRenderer
# What Reef may evolve: each kind of file, at the path where dsh reads it. A config/<target>.json
# of the tree merges into that config file (config, below).
evolve:
  rules: dsh/AGENTS.md
  skill: dsh/skills/{name}/SKILL.md
  # dsh's only command surface is a user invocable skill (/name) under its
  # second skill root.
  command: dsh-agents/skills/{name}/SKILL.md
  # A cordis plugin module that the patch layers insert by relative path, the
  # web patch from the headless profile's directory.
  extension: dsh/profiles/headless/extensions/{name}.mjs
# The agent's directories under the root, each with the variable that moves it there. What the agent writes
# in them is its state, never residue, and a sandbox keeps them writable.
dirs:
  dsh: DSH_HOME
  dsh-agents: DSH_AGENTS_HOME
sessions: {format: deepseek-session-jsonl, path: dsh/sessions}
# How to point dsh at a model endpoint, per API dialect: a hand declared
# llm-pi-ai route selected by agent-default-model, its key named by
# apiKeyEnv and supplied through the .env file. Each profile's patch carries
# the route.
# Reef renders the set matching its model binding's api into evaluation
# runs; the served tree never carries a provider or a key.
model:
  openai:
    - target: primary
      data:
        llm-pi-ai:
          config:
            providers:
              reef:
                displayName: Reef
                apiKeyEnv: REEF_API_KEY
                api: openai-completions
                baseURL: "{base_url}/v1"
                models:
                  - id: "{model}"
        agent-default-model:
          config:
            provider: reef
            model: "{model}"
    - target: web
      data:
        llm-pi-ai:
          config:
            providers:
              reef:
                displayName: Reef
                apiKeyEnv: REEF_API_KEY
                api: openai-completions
                baseURL: "{base_url}/v1"
                models:
                  - id: "{model}"
        agent-default-model:
          config:
            provider: reef
            model: "{model}"
    - target: env
      data:
        REEF_API_KEY: "{api_key}"
  anthropic:
    - target: primary
      data:
        llm-pi-ai:
          config:
            providers:
              reef:
                displayName: Reef
                apiKeyEnv: REEF_API_KEY
                api: anthropic-messages
                baseURL: "{base_url}"
                models:
                  - id: "{model}"
        agent-default-model:
          config:
            provider: reef
            model: "{model}"
    - target: web
      data:
        llm-pi-ai:
          config:
            providers:
              reef:
                displayName: Reef
                apiKeyEnv: REEF_API_KEY
                api: anthropic-messages
                baseURL: "{base_url}"
                models:
                  - id: "{model}"
        agent-default-model:
          config:
            provider: reef
            model: "{model}"
    - target: env
      data:
        REEF_API_KEY: "{api_key}"
# How the agent runs: one evaluation run in a root of its own (the command, and variables
# beside the dirs), and on a person's machine a layer over the person's own configuration.
run:
  task:
    # Two commander layers parse the command line (the launcher, then the
    # headless app); each "--" ends one layer's options, so a task that starts
    # with a dash still reaches the app as its positional.
    argv: ["--profile", "headless", "--", "--", "{prompt}"]
    env:
      DSH_TELEMETRY_MODE: "DISABLED"
# The config files the agent reads, with the defaults Reef merges first and the checks the merged
# file must pass. A tree's config/<target>.json merges into one of them. The defaults and checks
# are optional: a new adapter can start with the paths alone.
config:
  primary:
    path: "dsh/profiles/headless/cordis.patch.yml"
    # A patched config replaces the plugin's whole config, so every key
    # the adapter relies on rides along: the session log stays where the
    # bundle put it and uncompressed (the reader cannot parse zstd), and
    # the LLM title call (one extra model request per run) and the
    # telemetry stay off.
    defaults:
      session-persistence-jsonl:
        config:
          root: "!!js dshHomePath('sessions')"
          compression: none
      session-title-llm:
        disabled: true
      session-telemetry-otel:
        disabled: true
    # The web target repeats these checks through the anchor, so both
    # profiles are held to them.
    checks: &patch_checks
      # The session log stays uncompressed (the reader cannot parse zstd),
      # and the LLM title call (one extra model request per run) and
      # the telemetry stay off.
      - key: [session-persistence-jsonl.config.compression, session-title-llm.disabled, session-telemetry-otel.disabled]
        match: IsDefault()
      - key: "."
        match: Each(Value(IsObject()))
        reason: a patch entry is an object holding config, disabled, or inject
      - key: "*.name"
        match: IsAbsent()
        reason: a patch entry keeps its own package
      # Every model call stays on Reef's model binding. The binding writes
      # the llm-pi-ai route reef, puts its key in .env, and selects the
      # route in agent-default-model; these hold only the keys it writes.
      - key: [agent-default-model, llm-pi-ai]
        match: Each(Key(Eq("config")))
        reason: Reef's model binding writes it
      - key: agent-default-model.config
        match: Each(Key(IsIn(["model", "provider"])))
        reason: Reef's model binding writes it
      - key: agent-default-model.config.provider
        match: AnyOf(IsAbsent(), Eq("reef"))
        reason: Reef's model binding writes it
      - key: llm-pi-ai.config
        match: Each(Key(Eq("providers")))
        reason: Reef's model binding writes it
      - key: llm-pi-ai.config.providers
        match: Each(Key(Eq("reef")))
        reason: Reef's model binding writes the only route, reef
      - key: llm-pi-ai.config.providers.reef
        match: Each(Key(IsIn(["api", "apiKeyEnv", "baseURL", "displayName", "models"])))
        reason: Reef's model binding writes it
      - key: llm-pi-ai.config.providers.reef.apiKeyEnv
        match: AnyOf(IsAbsent(), Eq("REEF_API_KEY"))
        reason: Reef's model binding writes it
      # DeepSeek's own adapter, whose config is its endpoint: Reef never
      # binds it. The plugins after it choose a call's provider, endpoint,
      # credential or model: the title call, a subagent, a declared agent,
      # the compaction summary and the web search model. ** reaches the key
      # under an object or under each object of a list.
      - key: llm-deepseek
        match: Each(Key(Eq("disabled")))
        reason: Reef's model binding chooses the provider, the endpoint, the credential and the model
      - key: [
          agent-loop.config.agents.**.model, agent-loop.config.agents.**.provider,
          compaction-basic.config.modelPolicies.**.summarizationModel,
          compaction-basic.config.modelPolicies.**.summarizationProvider,
          session-title-llm.config.model, session-title-llm.config.provider,
          tool-subagent.config.agentOptions.**.model, tool-subagent.config.agentOptions.**.provider,
          tool-subagent-fork.config.agentOptions.**.model, tool-subagent-fork.config.agentOptions.**.provider,
          web-search-deepseek.config.apiKeyEnv, web-search-deepseek.config.baseURL, web-search-deepseek.config.model,
        ]
        match: IsAbsent()
        reason: Reef's model binding chooses the provider, the endpoint, the credential and the model
      # A js expression in those plugins is a value no check can read.
      - key: [
          agent-loop.**, compaction-basic.**, session-title-llm.**, tool-subagent.**, tool-subagent-fork.**,
          web-search-deepseek.**,
        ]
        match: Not(StartsWith("!!js "))
        reason: Reef's model binding chooses the provider, the endpoint, the credential and the model
  # The lowest trust layer of dsh's launch environment; the model binding
  # puts the key of its apiKeyEnv route here.
  env:
    path: "dsh/.env"
    defaults: {}
  # The profile `dsh web` boots, a person's session in the browser.
  # The same defaults as the headless patch: the web template compresses
  # its session log, and a compressed profile refuses a sessions root that
  # holds a headless profile's plain one.
  web:
    path: "dsh/profiles/web/cordis.patch.yml"
    defaults:
      session-persistence-jsonl:
        config:
          root: "!!js dshHomePath('sessions')"
          compression: none
      session-title-llm:
        disabled: true
      session-telemetry-otel:
        disabled: true
    checks: *patch_checks
  # The web profile's manifest. dsh writes patchReload live into a new web
  # profile, and with it the pinned `dsh web` exits at start ("user
  # patch-layer watching requires the Cordis HMR service"); startup reads
  # the patch once. dsh leaves a manifest that names the shipped bundles
  # and a patchReload as it is.
  web_manifest:
    path: "dsh/profiles/web/package.json"
    defaults:
      name: dsh-profile-web
      private: true
      dependencies: {}
      dsh:
        profile:
          bundles: ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app"]
          patchReload: startup
    checks:
      - key: dsh.profile.patchReload
        match: IsDefault()
