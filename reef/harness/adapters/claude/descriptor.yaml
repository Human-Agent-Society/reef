# Claude Code, driven headless per episode.
#
# CLAUDE_CONFIG_DIR relocates the whole config tree (settings.json, CLAUDE.md,
# skills/, commands/, plugins/, and the session transcripts under projects/)
# into the episode root, so nothing is read from or written to the user's real
# ~/.claude. DISABLE_AUTOUPDATER, DISABLE_TELEMETRY and
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC stop the startup network work
# (auto-update, telemetry, and the non-essential background traffic) that
# would otherwise make episodes non-deterministic. DISABLE_UPDATES makes
# Claude Code's own update and install commands refuse, so an episode's shell
# commands cannot replace the pinned version either. `-p --output-format json`
# is Claude Code's headless mode, which skips the folder trust prompt;
# `--permission-mode auto` matches opencode's `--auto` and pi's json
# mode — auto-approve without dropping every safety check, which is the
# right level for a hermetic episode root.
name: claude
binary: claude
# The vendor's install channel at the pinned version; consumed by the
# GET /reef/harness/install script, never by episode runs.
install:
  kind: npm
  package: "@anthropic-ai/claude-code"
  version: "2.1.257"
  binary_path: "node_modules/.bin/claude"
argv: ["-p", "{prompt}", "--output-format", "json", "--permission-mode", "auto"]
env:
  CLAUDE_CONFIG_DIR: "{root}/claude"
  DISABLE_AUTOUPDATER: "1"
  DISABLE_UPDATES: "1"
  DISABLE_TELEMETRY: "1"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
# Keep interactive installs on the same pinned version as evaluation episodes.
# An interactive run through reef-claude gets only CLAUDE_CONFIG_DIR from the
# env above. reef pins Claude Code's version, and Claude Code's own updater
# would otherwise install the latest release over the person's own claude:
# the background updater and `update` (alias `upgrade`) run
# `npm install --global`, and `install` links a native build at
# ~/.local/bin/claude. DISABLE_AUTOUPDATER stops only the background updater.
# DISABLE_UPDATES stops all three, wherever the command sits on the command
# line (`--verbose upgrade`) and in the session's own shell commands too:
# update and install print "Updates are disabled by your administrator" and
# exit 0. A lone --update or --upgrade, which Claude Code reads as `update`
# only with nothing else on the command line, stops at "unknown option" after
# the --settings below. reef-claude update is reef's own install of the
# served release. Claude Code copies settings.env over its environment, so
# the checks below refuse a tree whose settings.env sets either switch; a project
# .claude/settings.json of the person's own can still set them.
client_env:
  DISABLE_AUTOUPDATER: "1"
  DISABLE_UPDATES: "1"
# An interactive run otherwise registers the claude-cli:// link handler, and
# unless $HOME/.local/bin/claude exists it points the handler at the pinned
# binary, which replaces the handler of the person's own claude: on macOS the
# app "$HOME/Applications/Claude Code URL Handler.app", on Linux and WSL an
# xdg-mime default, on Windows a registry key. Claude Code reads this switch
# only from settings, and it skips a whole settings.json that fails its schema
# (cleanupPeriodDays 0, say), so the wrapper passes it as --settings, which the
# tree cannot change. The binary reads the last --settings: one the person
# passes replaces this one, and the settings.json default below still applies.
client_args: ["--settings", '{"disableDeepLinkRegistration":"disable"}']
# Claude Code prints its version for --version, -v and -V (alone, or before
# --verbose) before it reads any setting, and takes -V only there: after
# --settings, -V is an unknown option. A command line that starts with one of
# them starts no session, so the wrapper runs it without client_args.
client_version_args: ["--version", "-v", "-V"]
# --resume and --continue read the transcripts under projects/, which
# reef-claude would otherwise leave in the temp copy it removes. .claude.json
# records the finished onboarding, the approved API key and the trusted
# folders; without it every run starts at the theme picker again, and an
# interactive run asks again whether to trust the folder (the default answer
# is "No, exit").
client_state:
  - path: "claude/projects"
    kind: directory
  - path: "claude/.claude.json"
    kind: file
files:
  config:
    primary:
      path: "claude/settings.json"
      defaults:
        # No Co-Authored-By trailer written into commits an episode makes;
        # the updater is off through env and client_env, not here.
        includeCoAuthoredBy: false
        # Covers a run where the person passes their own --settings, which
        # replaces the one in client_args.
        disableDeepLinkRegistration: "disable"
      checks:
        - key: [includeCoAuthoredBy, disableDeepLinkRegistration]
          match: IsDefault()
        # Settings that choose the model, a credential helper or a login
        # method, which Reef's model binding owns.
        - key: [
            advisorModel, apiKeyHelper, availableModels, awsAuthRefresh, awsCredentialExport,
            enforceAvailableModels, fallbackModel, forceLoginGatewayUrl, forceLoginMethod, gcpAuthRefresh,
            model, modelOverrides, modelPicker, proxyAuthHelper, switchModelsOnFlag,
          ]
          match: IsAbsent()
          reason: Reef's model binding chooses the model, the credential and the login method
        # Claude Code copies settings.env over its environment. It reads the
        # updater switches as on only for 1, true, yes or on, so a tree sets
        # neither, under any name Windows matches without case.
        - key: env
          match: Each(Key(Not(Uppercase(IsIn(["DISABLE_AUTOUPDATER", "DISABLE_UPDATES"])))))
          reason: the episode env and reef-claude set it so Claude Code keeps the pinned version
        - key: [env.DISABLE_TELEMETRY, env.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC]
          match: Not(Strip(Lowercase(IsIn(["0", "false", "off", "no", ""]))))
          reason: benchmark episodes keep telemetry and non-essential traffic off
        # The env names Claude Code 2.1.257 reads to choose the endpoint, the
        # provider, the credential or the model of a model call: every
        # ANTHROPIC_ name, the cloud providers and their credentials, the
        # provider switches, proxies, endpoints, sockets, credential helpers
        # and files, and model names. The binding writes the first three, and
        # the render refuses them from a tree without the binding's token.
        - key: env
          match: |-
            Each(Key(AnyOf(
              IsIn(["ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL"]),
              Not(Uppercase(AnyOf(
                StartsWith("ANTHROPIC_"), StartsWith("AWS_"), StartsWith("AZURE_"), StartsWith("GOOGLE_"),
                StartsWith("GCLOUD_"), StartsWith("GCE_"), StartsWith("CLOUDSDK_"), StartsWith("CLOUD_ML_"),
                StartsWith("VERTEX_"),
                StartsWith("CLAUDE_CODE_USE_ANTHROPIC_"), StartsWith("CLAUDE_CODE_USE_BEDROCK"),
                StartsWith("CLAUDE_CODE_USE_FOUNDRY"), StartsWith("CLAUDE_CODE_USE_GATEWAY"),
                StartsWith("CLAUDE_CODE_USE_MANTLE"), StartsWith("CLAUDE_CODE_USE_VERTEX"),
                StartsWith("CLAUDE_CODE_PROVIDER_"), AllOf(StartsWith("CLAUDE_CODE_SKIP_"), EndsWith("_AUTH")),
                EndsWith("_MODEL"), HasSubstr("_MODEL_CATALOG"), HasSubstr("_MODEL_OPTION"), HasSubstr("_MODEL_FORCE"),
                HasSubstr("PROXY"), HasSubstr("BASE_URL"), HasSubstr("ENDPOINT"), HasSubstr("SOCKET"),
                HasSubstr("API_KEY"), HasSubstr("AUTH_"), HasSubstr("CREDS"), HasSubstr("CREDENTIAL"),
                HasSubstr("HELPER"), HasSubstr("FILE_DESCRIPTOR")
              )))
            )))
          reason: Reef's model binding chooses the endpoint, the credential and the model
        # Claude Code merges the JSON object in CLAUDE_CODE_EXTRA_BODY into
        # every request body, over the bound model, so the object names no
        # model (model, or OpenRouter's fallback models).
        - key: env
          match: |-
            Each(AnyOf(
              Key(Not(Uppercase(Eq("CLAUDE_CODE_EXTRA_BODY")))),
              Value(ParseJson(AllOf(IsObject(), Not(Contains(Key(IsIn(["model", "models"])))))))
            ))
          reason: Reef's model binding chooses the model, so CLAUDE_CODE_EXTRA_BODY must be a JSON object without model or models
  rules: "claude/CLAUDE.md"
  agent_command: "claude/commands/{name}.md"
  skill: "claude/skills/{name}/SKILL.md"
  # Claude Code's code surface is a plugin: a directory with an entry file.
  # The evolved node renders as that entry file; activating it still needs a
  # marketplace/settings reference, so treat this as the least-used node kind
  # for now (skills, commands, and rules carry the harness).
  code_extension: "claude/plugins/{name}/index.js"
trajectory:
  # Claude Code writes one JSONL transcript per session under
  # CLAUDE_CONFIG_DIR/projects/<cwd-slug>/<session-id>.jsonl, one event per
  # line — the same shape pi uses, read by the claude-session-jsonl reader.
  format: claude-session-jsonl
  path: "claude/projects"
cleanup_whitelist:
  - "claude/projects/**"
  # Claude Code's boot persists local state beside the rendered config:
  # a top-level state file, feature-gate cache, per-session todo lists, and
  # captured shell snapshots. Episode state, not residue.
  - "claude/.claude.json"
  - "claude/statsig/**"
  - "claude/todos/**"
  - "claude/shell-snapshots/**"
quirks: reef.harness.adapters.claude.quirks
# How to point Claude Code at a model endpoint. Claude Code speaks the
# Anthropic Messages API natively, so only the anthropic dialect is bound:
# settings.json's `env` block redirects the client at Reef's endpoint, which
# is Anthropic-compatible at {base_url}/v1/messages. Reef appends this set
# when it runs evaluation episodes; the served tree never carries a provider.
model_binding:
  anthropic:
    - target: primary
      data:
        env:
          ANTHROPIC_BASE_URL: "{base_url}"
          ANTHROPIC_AUTH_TOKEN: "{api_key}"
          ANTHROPIC_MODEL: "{model}"
