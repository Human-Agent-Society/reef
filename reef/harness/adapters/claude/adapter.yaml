# Claude Code, driven headless per rollout.
#
# CLAUDE_CONFIG_DIR relocates the whole config tree (settings.json, CLAUDE.md,
# skills/, commands/, plugins/, and the session transcripts under projects/)
# into the rollout root, so nothing is read from or written to the user's real
# ~/.claude. DISABLE_AUTOUPDATER, DISABLE_TELEMETRY and
# CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC stop the startup network work
# (auto-update, telemetry, and the non-essential background traffic) that
# would otherwise make rollouts non-deterministic. DISABLE_UPDATES makes
# Claude Code's own update and install commands refuse, so a rollout's shell
# commands cannot replace the pinned version either. `-p --output-format json`
# is Claude Code's headless mode, which skips the folder trust prompt;
# `--permission-mode auto` matches opencode's `--auto` and pi's json
# mode — auto-approve without dropping every safety check, which is the
# right level for a hermetic rollout root.
name: claude
binary: claude
# The vendor's install channel at the pinned version. Harness evolution startup
# installs it for the rollouts unless evolution.binary names a binary.
install:
  kind: npm
  package: "@anthropic-ai/claude-code"
  version: "2.1.257"
  binary_path: "node_modules/.bin/claude"
renderer: reef.harness.adapters.claude.render:ClaudeAdapterRenderer
# A release is a Claude Code plugin in plugin/, named reef: its skills and commands load as
# reef:<name>, its rules as the plugin's output style, and its extensions as hooks. A rollout
# loads it with --plugin-dir; a person's machine installs it from the local marketplace reef at
# the install root, and Claude Code loads it in place in every session. A plugin carries no
# settings and no memory, so a tree holds neither.
evolve:
  rules:
    renders: plugin/rules.md
    holds: the instructions Claude Code adds to its system prompt in every session, as the plugin's output style
  skill: plugin/skills/{name}/SKILL.md
  command: plugin/commands/{name}.md
  # A hooks entry of the tree's config/hooks.json runs the script at a Claude Code event.
  extension:
    renders: plugin/extensions/{name}.mjs
    holds: >-
      a script that a hooks entry of config/hooks.json runs at a Claude Code event, as
      node "${CLAUDE_PLUGIN_ROOT}/extensions/<name>.mjs"
# The agent's directories under the root, each with the variable that moves it there. What the agent writes
# in them is its state, never residue, and a sandbox keeps them writable.
dirs:
  claude: CLAUDE_CONFIG_DIR
sessions: {format: claude-session-jsonl, path: claude/projects}
# How to point Claude Code at a model endpoint. Claude Code speaks the
# Anthropic Messages API natively, so only the anthropic dialect is bound:
# settings.json's `env` block redirects the client at Reef's endpoint, which
# is Anthropic-compatible at {base_url}/v1/messages. Reef appends this set
# when it runs evaluation rollouts; the served tree never carries a provider.
model:
  anthropic:
    - target: primary
      data:
        env:
          ANTHROPIC_BASE_URL: "{base_url}"
          ANTHROPIC_AUTH_TOKEN: "{api_key}"
          ANTHROPIC_MODEL: "{model}"
# How the agent runs: one evaluation rollout in a root of its own (the command, and variables
# beside the dirs), and on a person's machine a layer over the person's own configuration.
run:
  rollout:
    argv: ["-p", "{prompt}", "--output-format", "json", "--permission-mode", "auto", "--plugin-dir", "{root}/plugin"]
    env:
      DISABLE_AUTOUPDATER: "1"
      DISABLE_UPDATES: "1"
      DISABLE_TELEMETRY: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  # How a person's machine runs Claude Code on a release: the person's own ~/.claude stays.
  # register installs the plugin reef from the local marketplace reef at the install root, and
  # Claude Code loads it in place in every session; a session that Reef starts also takes the
  # settings that bind the model, which win over the person's.
  layer:
    args:
      - ["--settings", "{root}/claude/settings.json"]
    register:
      - ["plugin", "marketplace", "add", "{root}"]
      - ["plugin", "install", "reef@reef"]
    unregister:
      - ["plugin", "uninstall", "reef@reef"]
      - ["plugin", "marketplace", "remove", "reef"]
# The config files the agent reads, with the defaults Reef merges first and the checks the merged
# file must pass. A tree's config/<target>.json merges into one of them. The defaults and checks
# are optional: a new adapter can start with the paths alone.
config:
  # Claude Code's own settings.json: the rollout's defaults and the model binding alone, since a
  # plugin carries no setting a tree could evolve.
  primary:
    path: "claude/settings.json"
    defaults:
      # No Co-Authored-By trailer written into commits a rollout makes;
      # the updater is off through env, not here.
      includeCoAuthoredBy: false
      disableDeepLinkRegistration: "disable"
    checks:
      - key: "."
        match: Each(Key(IsIn(["includeCoAuthoredBy", "disableDeepLinkRegistration", "env"])))
        reason: a Claude Code plugin carries no settings
      - key: [includeCoAuthoredBy, disableDeepLinkRegistration]
        match: IsDefault()
      - key: env
        match: Each(Key(IsIn(["ANTHROPIC_AUTH_TOKEN", "ANTHROPIC_BASE_URL", "ANTHROPIC_MODEL"])))
        reason: Reef's model binding chooses the endpoint, the credential and the model
  # The plugin's hooks: when each extension script runs.
  hooks:
    path: "plugin/hooks/hooks.json"
    checks:
      - key: "."
        match: Each(Key(Eq("hooks")))
        reason: a plugin's hooks.json holds only hooks
