# Reef's own coding agent: a Python loop inside this tree, driven headless per
# episode, whose tools are the tree's native tool files and whose loop events
# reach its native hook files. REEF_NATIVE_DIR relocates the whole rendered
# native directory, so nothing is read from the working directory.
name: native
binary: reef-native
# The harness tree of native, Reef's own loop. A method writes each part at
# its path; Reef checks the file as its format and renders it to its renders
# path, inside the native directory of an episode or of an install. A tree
# file that no part takes is refused.
#
# The loop reads no prompt directory and loads no vendor plugin, so native
# takes no command part and no code part: a tree that holds one fails
# validation instead of installing a file the loop never reads.
parts:
  rules:
    path: rules.md
    format: text
    renders: native/RULES.md
    holds: the instructions the loop reads at the start of every session
  skill:
    path: skills/{name}/SKILL.md
    format: skill
    renders: native/skills/{name}/SKILL.md
    holds: an Agent Skill, which the loop loads when its description fits the task
  native_tool:
    path: native/tools/{name}.py
    format: native_tool
    renders: native/tools/{name}.py
    holds: "a tool of the loop: run(args, workdir), then NAME, DESCRIPTION, PARAMETERS and CAPABILITIES"
  native_hook:
    path: native/hooks/{name}.py
    format: native_hook
    renders: native/hooks/{name}.py
    holds: "a listener at one event of the loop: listen(payload, next), then NAME and EVENT"
  native_graph:
    path: native/graphs/{name}.json
    format: native_graph
    renders: native/graphs/{name}.json
    holds: the loop's control flow, as stages and the transitions between them
  native_agent:
    path: native/agents/{name}.json
    format: native_agent
    renders: native/agents/{name}.json
    holds: one agent the loop delegates to, with its graph, tools and skills
  # Loop code runs in the loop's own process with its privileges, so a change
  # always waits for a person.
  native_loop:
    path: native/loops/{name}.py
    format: native_loop
    renders: native/loops/{name}.py
    holds: "the loop itself as code: run_turn(ctx), which runs the root turn in place of the graph"
    review: true
  config:
    path: config/{name}.json
    format: config
    holds: a JSON object merged into native/config.json (primary) or native/models.json (models)
# How Reef runs the agent for one evaluation episode, in an episode root of its own: the
# command, and the variables that point the agent's configuration at that root.
episode:
  argv: ["-p", "{prompt}"]
  env:
    REEF_NATIVE_DIR: "{root}/native"
    REEF_NATIVE_SESSION_DIR: "{root}/native/sessions"
# The config files the harness reads: the defaults Reef merges first, and the checks the merged
# file must pass. A tree's config part (see parts) merges into one of them.
config:
  primary:
    path: "native/config.json"
    defaults: {}
  models:
    path: "native/models.json"
    defaults: {}
# The served model reaches the loop through this file only; the served tree
# never carries a provider.
model_binding:
  openai:
    - target: models
      data:
        api: openai
        base_url: "{base_url}"
        api_key: "{api_key}"
        model: "{model}"
trajectory:
  format: native-jsonl
  path: "native/sessions"
# The loop writes its session here, so the sandbox executor opens it while the rest of the root stays read only.
writable_paths:
  - "native/sessions"
cleanup_whitelist:
  - "native/sessions/**"
  - "native/tools/__pycache__/**"
  - "native/hooks/__pycache__/**"
