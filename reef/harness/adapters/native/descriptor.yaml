# Reef's own coding agent: a Python loop inside this tree, driven headless per
# episode, whose tools are native_tool nodes and whose loop events listen to
# native_hook nodes. REEF_NATIVE_DIR relocates the whole composition root so
# nothing is read from the working directory.
name: native
binary: reef-native
argv: ["-p", "{prompt}"]
env:
  REEF_NATIVE_DIR: "{root}/native"
  REEF_NATIVE_SESSION_DIR: "{root}/native/sessions"
files:
  config:
    primary:
      path: "native/config.json"
      defaults: {}
    models:
      path: "native/models.json"
      defaults: {}
  rules: "native/RULES.md"
  agent_command: "native/commands/{name}.md"
  skill: "native/skills/{name}/SKILL.md"
  code_extension: "native/extensions/{name}.py"
  native_tool: "native/tools/{name}.py"
  native_hook: "native/hooks/{name}.py"
  native_graph: "native/graphs/{name}.json"
trajectory:
  format: native-jsonl
  path: "native/sessions"
cleanup_whitelist:
  - "native/sessions/**"
  - "native/tools/__pycache__/**"
  - "native/hooks/__pycache__/**"
# The served model reaches the loop through this file only; the served tree
# never carries a provider.
model_binding:
  openai:
    - target: models
      data:
        api: openai
        base_url: "{base_url}"
        api_key: "{api_key}"
        model: "{model}"
