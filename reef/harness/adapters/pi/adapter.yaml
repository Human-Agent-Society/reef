# The pi coding agent, driven headless per episode.
#
# PI_CODING_AGENT_DIR relocates the whole configuration directory (settings.json,
# models.json, AGENTS.md, prompts/, skills/, extensions/), so nothing is
# rendered into a project-local .pi/ and the trust gate never fires.
# PI_OFFLINE kills all startup network work and PI_SKIP_VERSION_CHECK pins
# the self-updater; both keep episodes deterministic and hermetic.
name: pi
binary: pi
# The vendor's install channel at the pinned version. Harness evolution startup
# installs it for the episodes unless evolution.binary names a binary.
install:
  kind: npm
  package: "@earendil-works/pi-coding-agent"
  version: "0.84.2"
  binary_path: "node_modules/.bin/pi"
renderer: reef.harness.adapters.pi.render:PiAdapterRenderer
# What Reef may evolve: each kind of file, at the path where pi reads it. A config/<target>.json
# of the tree merges into that config file (config, below).
evolve:
  rules: pi-agent/AGENTS.md
  skill: pi-agent/skills/{name}/SKILL.md
  command: pi-agent/prompts/{name}.md
  extension: pi-agent/extensions/{name}.ts
# The agent's directories under the root, each with the variable that moves it there. What the agent writes
# in them is its state, never residue, and a sandbox keeps them writable.
dirs:
  pi-agent: PI_CODING_AGENT_DIR
  sessions: PI_CODING_AGENT_SESSION_DIR
sessions: {format: pi-session-jsonl, path: sessions}
# How to point pi at a model endpoint, per API dialect. Reef renders the set
# matching its model binding's api into evaluation episodes; the served tree
# never carries a provider. maxTokens is Reef's reply budget rather than pi's
# own default of 16384: a reasoning model spends that on its reasoning and
# answers with no text, which ends the turn with nothing written.
model:
  openai:
    - target: models
      data:
        providers:
          reef:
            api: openai-completions
            apiKey: "{api_key}"
            baseUrl: "{base_url}/v1"
            models:
              - id: "{model}"
                maxTokens: "{max_output_tokens}"
    - target: primary
      data:
        defaultModel: "reef/{model}"
        defaultProvider: reef
  responses:
    - target: models
      data:
        providers:
          reef:
            api: openai-responses
            apiKey: "{api_key}"
            baseUrl: "{base_url}/v1"
            models:
              - id: "{model}"
                maxTokens: "{max_output_tokens}"
    - target: primary
      data:
        defaultModel: "reef/{model}"
        defaultProvider: reef
  anthropic:
    - target: models
      data:
        providers:
          reef:
            api: anthropic-messages
            apiKey: "{api_key}"
            baseUrl: "{base_url}"
            models:
              - id: "{model}"
                maxTokens: "{max_output_tokens}"
    - target: primary
      data:
        defaultModel: "reef/{model}"
        defaultProvider: reef
# How the agent runs: one evaluation episode in a root of its own (the command, and variables
# beside the dirs), and on a person's machine a layer over the person's own configuration.
run:
  episode:
    argv: ["--mode", "json", "-p", "{prompt}"]
    env:
      PI_OFFLINE: "1"
      PI_SKIP_VERSION_CHECK: "1"
  # How a person's machine runs pi on a release: the person's own ~/.pi/agent stays, and the
  # release loads over it. -e loads the install's skills, prompts and extensions, and on a name
  # both define the release's wins. The rules follow the person's AGENTS.md. pi reads models.json
  # and settings.json only from its own directory, so an extension the render adds registers the
  # release's providers, and the release's settings come as flags (the renderer's layer_args).
  # pi still writes the person's settings.json when the person changes the model.
  layer:
    args:
      - ["-e", "{root}/pi-agent"]
      - ["--append-system-prompt", "{root}/pi-agent/AGENTS.md"]
      - ["--model", "reef/{model}"]
# The config files the agent reads, with the defaults Reef merges first and the checks the merged
# file must pass. A tree's config/<target>.json merges into one of them. The defaults and checks
# are optional: a new adapter can start with the paths alone.
config:
  primary:
    path: "pi-agent/settings.json"
    defaults: {}
    checks:
      # They choose the models a run may use or send every call through
      # another host.
      - key: [enabledModels, httpProxy]
        match: IsAbsent()
        reason: Reef's model binding chooses the endpoint and the model
      # pi reads settings.json only from its own directory, and on a person's machine that is
      # the person's own, so a person's machine takes a setting of a release only as a flag
      # (the renderer's layer_args): the thinking level as --thinking, and no built-in tools
      # as --no-builtin-tools. The binding writes defaultProvider and defaultModel.
      - key: "."
        match: Each(Key(IsIn(["defaultThinkingLevel", "defaultTools", "defaultProvider", "defaultModel"])))
        reason: a person's machine applies no other pi setting of a release
      - key: defaultThinkingLevel
        match: AnyOf(IsAbsent(), IsIn(["off", "minimal", "low", "medium", "high", "xhigh", "max"]))
        reason: pi's --thinking takes only these levels
      # A list of some built-in tools has no flag: --tools allows extension tools only by name.
      - key: defaultTools
        match: AnyOf(IsAbsent(), Eq([]))
        reason: a person's machine takes only no built-in tools, as --no-builtin-tools
  models:
    path: "pi-agent/models.json"
    defaults: {}
    # The binding writes the provider reef and selects it with
    # defaultProvider and defaultModel in settings.json. Another provider,
    # with its own baseUrl or pi's built in one with a new endpoint, is the
    # tree choosing where calls go.
    checks:
      - key: providers
        match: Each(Key(Eq("reef")))
        reason: Reef's model binding chooses the provider, the endpoint, the credential and the model
      - key: providers.reef
        match: Each(Key(IsIn(["api", "apiKey", "baseUrl", "models"])))
        reason: Reef's model binding chooses the provider, the endpoint, the credential and the model
