# The harness tree Codex takes. A method writes each part at its path; Reef
# checks the file as its format and renders it to its renders path, inside
# the Codex home of an episode or of an install. A tree file that no part
# takes is refused.
# When a person and Reef both change a file, its part's merge decides: lines merges
# the lines each changed, and file, the default, refuses.
#
# Codex can run lifecycle hooks, but hook processes do not share Codex's own
# command sandbox, so Codex takes no code part until Reef can isolate them.
parts:
  rules:
    path: rules.md
    format: text
    merge: lines
    renders: codex/AGENTS.md
    holds: the instructions Codex reads at the start of every session
  skill:
    path: skills/{name}/SKILL.md
    format: skill
    merge: lines
    renders: codex/skills/{name}/SKILL.md
    holds: an Agent Skill, which Codex loads when its description fits the task
  # Codex 0.153.4 loads no custom prompts (its TUI refuses /name), so a
  # command is a skill that a person runs as $name. A skill and a command of
  # one name render to one path and are refused.
  command:
    path: commands/{name}.md
    format: skill
    merge: lines
    renders: codex/skills/{name}/SKILL.md
    holds: a prompt template that a person runs as $name, rendered as a skill
  config:
    path: config/{name}.json
    format: config
    holds: a JSON object merged into codex/config.toml (primary) or codex/models.json (models)
