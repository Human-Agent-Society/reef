# OpenAI Codex CLI, driven through its non-interactive exec mode.
#
# CODEX_HOME relocates user configuration, rules, hooks, skills, and session
# rollouts into the episode root. Codex lists the skills below
# $CODEX_HOME/skills in exec and in its TUI, so a reef-codex session, which
# keeps the person's own HOME, finds the same skills an episode does. The CLI
# keeps model-generated commands in a workspace-write sandbox and never waits
# for an approval during a benchmark episode.
name: codex
binary: codex
install:
  kind: npm
  package: "@openai/codex"
  version: "0.153.4"
  binary_path: "node_modules/.bin/codex"
# An episode never waits for an approval and never searches the web: these
# overrides win over config.toml. The tree may not set approval_policy, so a
# person's reef-codex session keeps Codex's own on-request default: the model
# asks the person before it runs a command outside the sandbox, such as a
# wrapper call that reaches reef. The session reads the tree's web_search.
argv:
  - exec
  - --json
  - --strict-config
  - --config
  - approval_policy="never"
  - --config
  - web_search="disabled"
  - --sandbox
  - workspace-write
  - --skip-git-repo-check
  - "{prompt}"
# A further message resumes the latest session in CODEX_HOME with the same
# overrides. resume takes no --sandbox flag, so the sandbox mode is a config.
continue_argv:
  - exec
  - resume
  - --last
  - --json
  - --strict-config
  - --config
  - approval_policy="never"
  - --config
  - web_search="disabled"
  - --config
  - sandbox_mode="workspace-write"
  - --skip-git-repo-check
  - "{prompt}"
env:
  CODEX_HOME: "{root}/codex"
# resume finds a session by scanning the rollouts under sessions/. The state
# database stays out: it records each rollout's absolute path in the temp
# copy reef-codex removes, and a thread whose recorded path is gone does not
# resume.
client_state:
  - path: "codex/sessions"
    kind: directory
files:
  config:
    primary:
      path: "codex/config.toml"
      defaults:
        web_search: disabled
        check_for_update_on_startup: false
        analytics:
          enabled: false
        feedback:
          enabled: false
        features:
          apps: false
          enable_request_compression: false
          hooks: false
          plugins: false
          shell_snapshot: false
          skill_mcp_dependency_install: false
        otel:
          exporter: none
          log_user_prompt: false
          metrics_exporter: none
          trace_exporter: none
        sandbox_workspace_write:
          network_access: false
      # web_search may take any value Codex reads, because the episode argv
      # pins it disabled and only a person's reef-codex session reads the
      # tree's value.
      checks:
        # The episode argv pins never, and a reef-codex session keeps Codex's
        # on-request default, so the person approves each command that leaves
        # the sandbox.
        - key: approval_policy
          match: IsAbsent()
          reason: episodes pin never, and a reef-codex session keeps on-request
        # The config.toml keys a tree may set, and the keys Reef's model
        # binding writes, which the render refuses from a tree without it.
        # The entire file is treated as a dict.
        - key: "."
          match: |-
            Each(Key(IsIn([
              "analytics", "check_for_update_on_startup", "features", "feedback", "model_auto_compact_token_limit",
              "model_auto_compact_token_limit_scope", "model_context_window", "model_reasoning_effort",
              "model_reasoning_summary", "model_verbosity", "otel", "sandbox_workspace_write",
              "tool_output_token_limit", "web_search",
              "model", "model_provider", "model_providers"
            ])))
          reason: the other codex config keys are not admitted for benchmark episodes
        - key: web_search
          match: IsIn(["disabled", "cached", "indexed", "live"])
        - key: [
            check_for_update_on_startup, analytics.enabled, feedback.enabled, otel,
            sandbox_workspace_write.network_access,
            features.apps, features.hooks, features.plugins, features.shell_snapshot,
            features.skill_mcp_dependency_install,
          ]
          match: IsDefault()
        - key: features
          match: |-
            Each(Key(IsIn([
              "apps", "enable_request_compression", "hooks", "plugins", "shell_snapshot",
              "skill_mcp_dependency_install"
            ])))
        - key: sandbox_workspace_write
          match: Each(Key(IsIn(["network_access", "writable_roots"])))
        - key: sandbox_workspace_write.writable_roots
          match: AnyOf(IsAbsent(), Eq([]))
        # The provider Reef's model binding writes, with only its keys.
        - key: model_provider
          match: AnyOf(IsAbsent(), Eq("reef"))
          reason: Reef's model binding chooses the model provider
        - key: model_providers
          match: Each(Key(Eq("reef")))
          reason: Reef's model binding chooses the model provider
        - key: model_providers.*
          match: |-
            Each(Key(IsIn(["base_url", "experimental_bearer_token", "name", "supports_websockets", "wire_api"])))
          reason: Reef's model binding chooses the model provider
    models:
      path: "codex/models.json"
      # Model metadata by model name, which the quirks module turns into
      # Codex's model catalog.
      checks:
        # The entire file is treated as a dict.
        - key: "."
          match: Each(Key(Eq("models")))
        - key: models
          match: AnyOf(IsAbsent(), IsObject())
  rules: "codex/AGENTS.md"
  # Codex 0.153.4 loads no custom prompts (its TUI refuses /name), so an
  # agent_command renders as a skill the person types as $name. A skill and
  # an agent_command with one name render to one path and are refused.
  agent_command: "codex/skills/{name}/SKILL.md"
  skill: "codex/skills/{name}/SKILL.md"
  # Kept as the shared schema's render target; the quirk rejects this node
  # until hook processes can be isolated separately from Codex itself.
  code_extension: "codex/extensions/{name}.mjs"
trajectory:
  format: codex-session-jsonl
  path: "codex/sessions"
# Codex persists session databases and bundled system skills beside its
# config. The sandbox opens this directory for those writes, then rebinds
# every rendered input below it read-only.
writable_paths:
  - "codex"
cleanup_whitelist:
  - "codex/sessions/**"
  # Codex 0.153.4 initializes its isolated user home on first boot. These are
  # versioned local databases, copied system skills, coordination files, and
  # temporary discovery state observed by the real-binary smoke test.
  - "codex/.sandbox_migration"
  - "codex/.tmp/**"
  - "codex/tmp/arg0/**"
  - "codex/goals_1.sqlite*"
  - "codex/installation_id"
  - "codex/logs_2.sqlite*"
  - "codex/memories_1.sqlite*"
  - "codex/queue_1.sqlite*"
  - "codex/skills/.system/**"
  - "codex/state_5.sqlite*"
  - "codex/thread-writer-locks/**"
  - "codex/thread_history_1.sqlite*"
quirks: reef.harness.adapters.codex.quirks
model_binding:
  responses:
    - target: primary
      data:
        model: "{model}"
        model_provider: reef
        model_providers:
          reef:
            name: Reef
            base_url: "{base_url}/v1"
            wire_api: responses
            supports_websockets: false
            experimental_bearer_token: "{api_key}"
    - target: models
      data:
        models: "{model_metadata}"
