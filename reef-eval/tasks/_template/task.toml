schema_version = "1.4"

# Nothing crosses as files: the judge holds the truth and the verifier asks
# it over HTTP, so there are no declared artifacts.
artifacts = []

[task]
name = "reef-eval/my-task"                        # TODO(task): name it
description = "Placeholder: maximize x in [0, 1]; reward = x. TODO(task): describe yours"

[metadata]
category = "autoresearch"

[agent]
timeout_sec = 600.0                          # TODO(task): the budget

[verifier]
timeout_sec = 60.0                           # runs in the environment, asks the judge for /final

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
network_mode = "allowlist"
allowed_hosts = ["judge"]              # the judge sidecar is the only reachable host
# gpus = 1                                   # GPU tasks: cloud backends honor this;
                                             # local Docker needs an environment/docker-compose.yaml
                                             # device reservation too — see docs/authoring-tasks.md
