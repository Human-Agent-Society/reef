schema_version = "1.4"

artifacts = ["/home/workspace/dabic_gravity_vinton/outputs"]

[task]
name = "edgebench/dabic_gravity_inversion"
description = "Dabic Gravity Inversion"

[metadata]
benchmark = "edgebench"
category = "Scientific Problems & ML"
judge_parser = "structured_json"
score_direction = "maximize"

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 21600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
