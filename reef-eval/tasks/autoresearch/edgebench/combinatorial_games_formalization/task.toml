schema_version = "1.4"

artifacts = ["/home/workspace/se-bmk-intern/combinatorial-games"]

[task]
name = "edgebench/combinatorial_games_formalization"
description = "Combinatorial Games Formalization"

[metadata]
benchmark = "edgebench"
category = "Formal Math & Theorem Proving"
judge_parser = "structured_json"
score_direction = "maximize"
rescale_kind = "linear"
rescale_lower = 0.0
rescale_upper = 1.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
