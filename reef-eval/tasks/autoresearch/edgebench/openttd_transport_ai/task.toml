schema_version = "1.4"

artifacts = ["/home/workspace/openttd_ai/my_ai"]

[task]
name = "edgebench/openttd_transport_ai"
description = "Openttd Transport Ai"

[metadata]
benchmark = "edgebench"
category = "Interactive Games & Simulators"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "log_max"
rescale_baseline = 100000.0
rescale_expert = 1000000000.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
