schema_version = "1.4"

artifacts = ["/home/workspace/treants_forest/solution.py"]

[task]
name = "edgebench/treant_forest"
description = "Treant Forest"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "piecewise_max"
rescale_baseline = 5369.0
rescale_rank30 = 88189.0
rescale_rank1 = 330195.0
rescale_super_anchor = 451198.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 870.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
