schema_version = "1.4"

artifacts = ["/home/workspace/train.py", "/home/workspace/infer.py", "/home/workspace/models", "/home/workspace/submission.json", "/home/workspace/requirements.txt", "/home/workspace/README.md"]

[task]
name = "edgebench/k12_math_recommendation"
description = "K12 Math Recommendation"

[metadata]
benchmark = "edgebench"
category = "Professional Knowledge Work"
judge_parser = "structured_json"
score_direction = "maximize"

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
