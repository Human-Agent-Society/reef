schema_version = "1.4"

artifacts = ["/home/workspace/p1/T1.cpp", "/home/workspace/p1/T2.cpp", "/home/workspace/p1/T3.cpp", "/home/workspace/p1/T4.cpp", "/home/workspace/p1/T5.cpp", "/home/workspace/p1/T6.cpp"]

[task]
name = "edgebench/tree_block_partitioning"
description = "Tree Block Partitioning"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "linear"
rescale_lower = 0.0
rescale_upper = 100.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
