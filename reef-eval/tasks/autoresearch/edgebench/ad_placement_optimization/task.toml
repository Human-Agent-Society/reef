schema_version = "1.4"

artifacts = ["/home/workspace/ad-placement/solution.cpp"]

[task]
name = "edgebench/ad_placement_optimization"
description = "Ad Placement Optimization"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "piecewise_max"
rescale_baseline = 0.0
rescale_rank30 = 47169682940.0
rescale_rank1 = 49702568341.0
rescale_super_anchor = 50000000000.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
