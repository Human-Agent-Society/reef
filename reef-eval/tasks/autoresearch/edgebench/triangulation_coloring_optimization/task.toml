schema_version = "1.4"

artifacts = ["/home/workspace/triangulation_coloring/solution.py"]

[task]
name = "edgebench/triangulation_coloring_optimization"
description = "Triangulation Coloring Optimization"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "minimize"
rescale_kind = "piecewise_log_min"
rescale_baseline = 6102378.0
rescale_rank30 = 3372655.0
rescale_rank1 = 200033.0
rescale_super_anchor = 100016.5

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
