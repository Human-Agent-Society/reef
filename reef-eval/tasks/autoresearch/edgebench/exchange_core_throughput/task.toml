schema_version = "1.4"

artifacts = ["/home/workspace/exchange-core/src/main", "/home/workspace/exchange-core/pom.xml", "/home/workspace/exchange-core/.mvn"]

[task]
name = "edgebench/exchange_core_throughput"
description = "Exchange Core Throughput"

[metadata]
benchmark = "edgebench"
category = "Systems & Software Engineering"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "log_max"
rescale_baseline = 2090.634594076933
rescale_expert = 6000.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
