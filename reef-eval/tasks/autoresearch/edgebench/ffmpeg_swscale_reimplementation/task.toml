schema_version = "1.4"

artifacts = ["/home/workspace/swscale-impl/."]

[task]
name = "edgebench/ffmpeg_swscale_reimplementation"
description = "Ffmpeg Swscale Reimplementation"

[metadata]
benchmark = "edgebench"
category = "Systems & Software Engineering"
judge_parser = "pytest_v"
score_direction = "maximize"
rescale_kind = "log_anchor"
rescale_anchor_raw = 14.155
rescale_anchor_score = 43.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
