schema_version = "1.4"

artifacts = ["/home/workspace/vibrating_path/solution.py"]

[task]
name = "edgebench/vibrating_path_graph_coloring"
description = "Vibrating Path Graph Coloring"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "minimize"
rescale_kind = "piecewise_log_min"
rescale_baseline = 31051708.0
rescale_rank30 = 3288665.0
rescale_rank1 = 2181554.0
rescale_super_anchor = 1904776.25

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
