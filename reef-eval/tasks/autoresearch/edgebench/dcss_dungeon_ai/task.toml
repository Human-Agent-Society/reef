schema_version = "1.4"

artifacts = ["/home/dcss_agent/my_bot.rc", "/home/dcss_agent/my_bot_include.rc"]

[task]
name = "edgebench/dcss_dungeon_ai"
description = "Dcss Dungeon Ai"

[metadata]
benchmark = "edgebench"
category = "Interactive Games & Simulators"
judge_parser = "structured_json"
score_direction = "maximize"
rescale_kind = "log1p_max"
rescale_upper = 50000.0
rescale_baseline = 400.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 1100.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
