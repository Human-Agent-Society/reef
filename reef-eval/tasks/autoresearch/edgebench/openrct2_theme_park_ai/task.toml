schema_version = "1.4"

artifacts = ["/home/workspace/openrct2/my_plugin.js"]

[task]
name = "edgebench/openrct2_theme_park_ai"
description = "Openrct2 Theme Park Ai"

[metadata]
benchmark = "edgebench"
category = "Interactive Games & Simulators"
judge_parser = "score_sum"
score_direction = "maximize"
rescale_kind = "linear"
rescale_lower = 0.0
rescale_upper = 40000.0

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 2400.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
