schema_version = "1.4"

artifacts = ["/home/workspace/sebench_performance_takehome/solution.py"]

[task]
name = "edgebench/vliw_kernel_optimization"
description = "Vliw Kernel Optimization"

[metadata]
benchmark = "edgebench"
category = "Systems & Software Engineering"
judge_parser = "structured_json"
score_direction = "minimize"
rescale_kind = "log_min"
rescale_baseline = 4475.526541978607
rescale_expert = 1000.0

[agent]
