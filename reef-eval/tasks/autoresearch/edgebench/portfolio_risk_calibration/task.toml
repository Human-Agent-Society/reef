schema_version = "1.4"

artifacts = ["/home/workspace/portfolio_optimizer.py", "/home/workspace/requirements.txt", "/home/workspace/backtest_results.json"]

[task]
name = "edgebench/portfolio_risk_calibration"
description = "Portfolio Risk Calibration"

[metadata]
benchmark = "edgebench"
category = "Professional Knowledge Work"
judge_parser = "structured_json"
score_direction = "maximize"

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
