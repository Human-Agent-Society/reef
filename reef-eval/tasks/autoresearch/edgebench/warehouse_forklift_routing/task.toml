schema_version = "1.4"

artifacts = ["/home/workspace/warehouse_manager/solution.py"]

[task]
name = "edgebench/warehouse_forklift_routing"
description = "Warehouse Forklift Routing"

[metadata]
benchmark = "edgebench"
category = "Combinatorial Optimization"
judge_parser = "score_sum"
score_direction = "minimize"
rescale_kind = "piecewise_log_min"
rescale_baseline = 23277.847205
rescale_rank30 = 804.959064
rescale_rank1 = 395.802847
rescale_super_anchor = 293.51379275

[agent]
# EdgeBench's official budgets are 2-12 h; the budget is a RUN parameter.
# Override per run: lab.run(..., agent={"override_timeout_sec": h * 3600},
# tags={"budget": h}).
timeout_sec = 43200.0

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1800.0
network_mode = "no-network"
