schema_version = "1.4"

# Only declared artifacts cross into the verifier container.
artifacts = []

[task]
name = "reef-eval/bin-packing"
description = "Pack 60 items into as few capacity-100 bins as possible. Reward = first-fit bins / your bins."

[metadata]
category = "autoresearch"

[agent]
# The timeout IS the budget; a timeout is a normal ending and the verifier
# still grades the best-so-far snapshot.
timeout_sec = 900.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
network_mode = "allowlist"
allowed_hosts = ["judge"]              # the judge sidecar is the only reachable host
