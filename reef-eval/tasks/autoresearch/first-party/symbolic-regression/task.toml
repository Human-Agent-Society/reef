schema_version = "1.4"

# Only declared artifacts cross into the verifier container.
artifacts = []

[task]
name = "reef-eval/symbolic-regression"
description = "Fit a formula to sampled points. Reward = 1/(1+RMSE) on HELD-OUT points the agent never sees — the anti-overfitting wall."

[metadata]
category = "autoresearch"

[agent]
# The timeout IS the budget; a timeout is a normal ending and the verifier
# still grades the best-so-far snapshot.
timeout_sec = 900.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
network_mode = "allowlist"
allowed_hosts = ["judge"]              # the judge sidecar is the only reachable host
