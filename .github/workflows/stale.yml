name: manage inactive issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    if: github.repository == 'Human-Agent-Society/reef'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          operations-per-run: 100
          exempt-draft-pr: true
          exempt-issue-labels: "KIV,RFC,help wanted,roadmap,status: blocked,status: confirmed,status: keep-open,status: ready"
          exempt-pr-labels: "KIV,RFC,status: blocked,status: keep-open"

          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: stale
          stale-issue-message: >-
            This issue has had no activity for 90 days. It will close in 30
            days unless someone confirms that it is still relevant. Add
            `status: keep-open` when inactivity is expected.
          close-issue-message: >-
            Closing this issue after 120 days without activity. Reopen it, or
            open a current issue with updated context, if the work becomes
            relevant again.

          days-before-pr-stale: 60
          days-before-pr-close: 21
          stale-pr-label: stale
          stale-pr-message: >-
            This pull request has had no activity for 60 days. It will close in
            21 days unless the author or a reviewer confirms the next step.
            Draft pull requests and work marked `status: keep-open` are exempt.
          close-pr-message: >-
            Closing this pull request after 81 days without activity. It may be
            reopened or resubmitted when the work is ready to continue.
