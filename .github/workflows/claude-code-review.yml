name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # A pull request from a fork gets no repository secrets and no OIDC token,
    # so the action cannot sign in. Dependabot runs get only Dependabot secrets,
    # so the OAuth token is empty, and the action refuses bot actors. Skip both.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The action downloads Bun from GitHub releases, and that download can fail with HTTP 504 for hours.
      # npm gives the same binary. Keep the version the same as the action's bun-version.
      - name: Install Bun from npm
        run: npm install --prefix "$RUNNER_TEMP/bun" --no-save @oven/bun-linux-x64@1.4.4

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          path_to_bun_executable: ${{ runner.temp }}/bun/node_modules/@oven/bun-linux-x64/bin/bun
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

