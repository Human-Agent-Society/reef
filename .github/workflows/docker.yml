name: docker

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "reef/train/**"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  # Run on every pull request so docker-gate is always available as a stable
  # required check. The path filter remains on main pushes.
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static build checks only: a full build is not possible here - the unpacked
  # slimerl/slime base exceeds every disk on hosted runners (verified: fails
  # on / and on /mnt). Image builds happen on deployment machines; PRs get
  # the Dockerfile linted without pulling the base.
  check:
    name: docker-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --check --target reef -f docker/Dockerfile.reef .
      - run: docker build --check --target tttd -f docker/Dockerfile.reef .

  # Full image build, kept for the day a runner with 100GB+ of docker storage
  # exists (self-hosted or larger hosted). Uncomment, point runs-on at that
  # runner, and re-add "workflow_dispatch:" under "on:".
  # build:
  #   if: github.event_name == 'workflow_dispatch'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 45
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - run: |
  #         sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
  #           /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache
  #         sudo docker image prune --all --force
  #         sudo systemctl stop docker
  #         echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
  #         sudo systemctl start docker
  #         df -h / /mnt
  #     - run: docker build -f docker/Dockerfile.reef -t reef:ci .
