name: assign merge oncall

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assign and announce the merge oncall
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- reef-merge-oncall-assignment -->";
            const configPath = ".github/merge-oncall.json";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const ref = context.payload.pull_request.base.ref;

            const response = await github.rest.repos.getContent({
              owner,
              repo,
              path: configPath,
              ref,
            });
            if (Array.isArray(response.data) || response.data.type !== "file") {
              core.setFailed(`${configPath} is not a file`);
              return;
            }

            const config = JSON.parse(
              Buffer.from(response.data.content, "base64").toString("utf8"),
            );
            const oncall = config.login;
            if (typeof oncall !== "string" || !/^[A-Za-z0-9-]+$/.test(oncall)) {
              core.setFailed(`${configPath} must contain a valid GitHub login`);
              return;
            }

            await github.rest.issues.addAssignees({
              owner,
              repo,
              issue_number,
              assignees: [oncall],
            });

            const body = `${marker}\nMerge Oncall: @${oncall}\n\n` +
              "The merge oncall will route reviews and keep this pull request " +
              "moving toward a clear decision.";
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              if (existing.body !== body) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
