name: reef-eval-e2e

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reef-eval/reef_eval/**"
      - "reef-eval/tasks/**"
      - "reef-eval/scripts/e2e_oracle.py"
      - "reef-eval/pyproject.toml"
      - ".github/workflows/reef-eval-e2e.yml"

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: reef-eval
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install REEF Eval and Harbor
        run: |
          python -m pip install uv
          uv venv
          uv pip install -e ".[harbor]"
      - name: Oracle gate
        run: uv run python scripts/e2e_oracle.py
      - name: Show trial artifacts on failure
        if: failure()
        run: find runs/e2e-oracle -maxdepth 4 -type f -print
