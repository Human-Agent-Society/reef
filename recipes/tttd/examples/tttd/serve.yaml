# Colocated Qwen3-8B TTT-Discover LoRA stack for harbor/erdos_min_overlap.
# Every value is literal except the two run.sh computes: TTTD_STATE_DIR, the
# absolute root all durable state hangs off, and REEF_INFERENCE_HOST, this
# machine's IP.

schema-version: 2
reef:
  host: 127.0.0.1
  port: 8900
  token: reef-local
  run-dir: ${TTTD_STATE_DIR}/stack
  ready-timeout: 120

inference:
  num-gpus: "${training.config.num_gpus}"
  tensor-parallel-size: "1"
  options:
    context-length: "30000"
    router-port: "30000"
    mem-fraction-static: "0.5"
    disable-prefill-cuda-graph: true
    cuda-graph-max-bs-decode: "128"
  model-path: work/model
  timeout-s: 7200
  backend-factory: reef.train.slime_backend.reef_adapters.sglang.chat.SGLangChatTrainingInferenceBackend
recipe:
  implementation: recipes.tttd.recipe:TTTDRecipe
  config:
    groups-per-step: 8
    rollouts-per-group: 64
    checkpoint-every-n-versions: 2
training:
  backend: slime
  ready-timeout: 3600
  ray-namespace: reef
  ray-actor-name: reef-train-bridge
  timeout-s: 7200
  config:
    num_gpus: 2
    # The grid and completion limit. harness/harbor_agent.py reads these same
    # keys, so the harness and the stack cannot disagree about the step.
    steps: 1
    max_new_tokens: 26000
    checkpoint_dir: ${TTTD_STATE_DIR}/checkpoints
    checkpoint_retention:
      max_storage_fraction: 0.8
      min_free_space_fraction: 0.1
      policy: latest

  options:
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    ref-load: "${inference.model-path}"
    save: "${training.config.checkpoint_dir}/megatron"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    save-interval: "${recipe.config.checkpoint-every-n-versions}"
    reef-checkpoint-max-storage-fraction: "${training.config.checkpoint_retention.max_storage_fraction}"
    reef-checkpoint-min-free-space-fraction: "${training.config.checkpoint_retention.min_free_space_fraction}"
    reef-checkpoint-policy: "${training.config.checkpoint_retention.policy}"
    megatron-to-hf-mode: "bridge"
    num-rollout: "${training.config.steps}"
    rollout-batch-size: "${recipe.config.groups-per-step}"
    n-samples-per-prompt: "${recipe.config.rollouts-per-group}"
    global-batch-size: "512"
    disable-rollout-global-dataset: true
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "${training.config.num_gpus}"
    num-gpus-per-node: "${training.config.num_gpus}"
    colocate: true
    tensor-model-parallel-size: "2"
    pipeline-model-parallel-size: "1"
    context-parallel-size: "1"
    expert-model-parallel-size: "1"
    expert-tensor-parallel-size: "1"
    padded-vocab-size: "151936"
    position-embedding-type: "rope"
    rotary-base: "1000000"
    swiglu: true
    disable-bias-linear: true
    normalization: "RMSNorm"
    group-query-attention: true
    qk-layernorm: true
    seq-length: "${TTTD_SEQ_LENGTH}"
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "${TTTD_MAX_TOKENS_PER_GPU}"
    recompute-granularity: "full"
    recompute-method: "uniform"
    recompute-num-layers: "1"
    megatron-lora-rank: "32"
    megatron-lora-alpha: "32"
    megatron-lora-dropout: "0"
    megatron-lora-target-modules:
      - linear_qkv
      - linear_proj
      - linear_fc1
      - linear_fc2
    check-lora-weight-equal: true
    verify-lora-base-weights: true
    optimizer: "adam"
    lr: "4e-5"
    lr-decay-style: "constant"
    override-opt-param-scheduler: true
    weight-decay: "0"
    adam-beta1: "0.9"
    adam-beta2: "0.95"
    adam-eps: "1e-8"
    clip-grad: "0"
    loss-type: "custom_loss"
    use-rollout-logprobs: true
    kl-coef: "0.1"
    entropy-coef: "0"
    rollout-temperature: "1"
    rollout-max-response-len: "30000"
    rollout-max-context-len: "30000"
    train-env-vars: "{\"PYTORCH_CUDA_ALLOC_CONF\":\"max_split_size_mb:512\"}"
    log-probs-chunk-size: "${TTTD_LOG_PROBS_CHUNK_SIZE}"
    attention-dropout: "0"
    hidden-dropout: "0"
    accumulate-allreduce-grads-in-fp32: true
    attention-softmax-in-fp32: true
    attention-backend: "flash"
storage:
  artifact-repository: ${TTTD_STATE_DIR}/artifacts.git
  artifact-work-dir: ${TTTD_STATE_DIR}/artifact-work
  artifact-cache-dir: ${TTTD_STATE_DIR}/artifact-cache
  agent-record-dir: ${TTTD_STATE_DIR}/agent-record

# Service processes launch locally; Slime owns distributed GPU model workers.
execution:
  training: ray
  rollout: ray

observability:
  wandb:
    enabled: false
    project: reef
    directory: ${TTTD_STATE_DIR}/wandb
