# Colocated Qwen3-8B TTT-Discover LoRA stack for a direct single GPU node.
#
# Cardinalities and sequence limits are deployment inputs, not algorithm
# constants. ``examples.tttd.deployments.qwen3_8b_lora.runner`` sets these
# variables from its function arguments:
#   TTTD_GROUPS_PER_STEP, TTTD_ROLLOUTS_PER_GROUP,
#   TTTD_GLOBAL_BATCH_SIZE, TTTD_PHASE1_MAX_TOKENS,
#   TTTD_MAX_RESPONSE_LENGTH, TTTD_SEQ_LENGTH, TTTD_ROLLOUT_TEMPERATURE.

run_dir: /tmp/reef-tttd-stack
ready_timeout: 3600

reef:
  host: 127.0.0.1
  model_path: ${TTTD_MODEL_PATH}
  port: 8900
  recipe: tttd
  token: ${REEF_TOKEN}
  batch_size: 1
  groups_per_step: ${TTTD_GROUPS_PER_STEP}
  rollouts_per_group: ${TTTD_ROLLOUTS_PER_GROUP}
  checkpoint_every_n_versions: ${TTTD_CHECKPOINT_INTERVAL}
  ray_address: 127.0.0.1:6379
  ray_namespace: reef
  ray_actor_name: reef-train-bridge
  inference_url: http://${TTTD_INFERENCE_HOST}:30000
  inference_timeout_s: 7200
  train_timeout_s: 7200
  inference_backend_factory: reef.train.slime.plugins.reef_adapters.sglang_chat_tttd.TTTDSGLangChatInferenceBackend
  artifact_repository: ${TTTD_STATE_DIR}/artifacts.git
  artifact_work_dir: ${TTTD_STATE_DIR}/artifact-work
  artifact_cache_dir: ${TTTD_STATE_DIR}/artifact-cache
  agent_data_dir: ${TTTD_STATE_DIR}/agent-data

training:
  num_gpus: ${TTTD_NUM_GPUS}
  cuda_visible_devices: ${TTTD_CUDA_VISIBLE_DEVICES}
  checkpoint_dir: ${TTTD_STATE_DIR}/checkpoints

services:
  - name: ray-head
    command: >-
      ray start --head --node-ip-address=127.0.0.1 --port=6379
      --include-dashboard=false --num-cpus=${TTTD_RAY_NUM_CPUS}
      --num-gpus=${training.num_gpus} --disable-usage-stats --block
    ready: ray health-check --address=127.0.0.1:6379
    cuda: ${training.cuda_visible_devices}

  - name: slime-driver
    command: >-
      python -m reef.train.slime.plugins.reef_adapters.driver
      --ready-file=/tmp/reef-tttd-bridge.ready
      --hf-checkpoint=${reef.model_path}
      --load=${TTTD_LOAD_PATH}
      --ref-load=${reef.model_path}
      --save=${training.checkpoint_dir}/megatron
      --save-hf=${training.checkpoint_dir}/hf/{rollout_id}
      --save-interval=${reef.checkpoint_every_n_versions}
      --megatron-to-hf-mode=bridge
      --num-rollout=${TTTD_NUM_STEPS}
      --rollout-batch-size=${reef.groups_per_step}
      --n-samples-per-prompt=${reef.rollouts_per_group}
      --global-batch-size=${TTTD_GLOBAL_BATCH_SIZE}
      --disable-rollout-global-dataset
      --actor-num-nodes=1
      --actor-num-gpus-per-node=${training.num_gpus}
      --rollout-num-gpus=${training.num_gpus}
      --rollout-num-gpus-per-engine=1
      --num-gpus-per-node=${training.num_gpus}
      --colocate
      --tensor-model-parallel-size=${TTTD_TENSOR_PARALLEL_SIZE}
      --pipeline-model-parallel-size=1
      --context-parallel-size=1
      --expert-model-parallel-size=1
      --expert-tensor-parallel-size=1
      --seq-length=${TTTD_SEQ_LENGTH}
      --use-dynamic-batch-size
      --max-tokens-per-gpu=${TTTD_MAX_TOKENS_PER_GPU}
      --recompute-granularity=full
      --recompute-method=uniform
      --recompute-num-layers=1
      --megatron-lora-rank=${TTTD_LORA_RANK}
      --megatron-lora-alpha=${TTTD_LORA_ALPHA}
      --megatron-lora-dropout=0
      --megatron-lora-target-modules
      linear_qkv linear_proj linear_fc1 linear_fc2
      --check-lora-weight-equal
      --verify-lora-base-weights
      --optimizer=adam
      --lr=4e-5
      --lr-decay-style=constant
      --override-opt-param-scheduler
      --weight-decay=0
      --adam-beta1=0.9
      --adam-beta2=0.95
      --adam-eps=1e-8
      --clip-grad=0
      --loss-type=custom_loss
      --custom-loss-function-path=reef.train.slime.training_algos.tttd.tttd_importance_sampling_loss
      --use-rollout-logprobs
      --advantage-estimator=grpo
      --kl-coef=0.1
      --custom-advantage-function-path=reef.train.slime.training_algos.tttd.apply_tttd_base_kl
      --entropy-coef=0
      --rollout-temperature=${TTTD_ROLLOUT_TEMPERATURE}
      --rollout-max-response-len=${TTTD_MAX_RESPONSE_LENGTH}
      --rollout-max-context-len=${TTTD_SEQ_LENGTH}
      --sglang-context-length=${TTTD_SEQ_LENGTH}
      --sglang-router-port=30000
      --sglang-mem-fraction-static=0.5
      --sglang-disable-prefill-cuda-graph
      --sglang-cuda-graph-max-bs-decode=${TTTD_CUDA_GRAPH_MAX_BS}
      --train-memory-margin-bytes=10737418240
      --train-env-vars='{"PYTORCH_CUDA_ALLOC_CONF":"max_split_size_mb:512"}'
      --log-probs-chunk-size=1024
      --attention-dropout=0
      --hidden-dropout=0
      --accumulate-allreduce-grads-in-fp32
      --attention-softmax-in-fp32
      --attention-backend=flash
    ready: >-
      test -f /tmp/reef-tttd-bridge.ready &&
      curl -sf http://${TTTD_INFERENCE_HOST}:30000/health
    ready_timeout: 3600
    env:
      RAY_ADDRESS: 127.0.0.1:6379
      REEF_RAY_NAMESPACE: reef
      REEF_RAY_ACTOR_NAME: reef-train-bridge
      REEF_TRAINING_RECIPE: tttd
      CUDA_DEVICE_MAX_CONNECTIONS: "1"
      NCCL_NVLS_ENABLE: "0"
    depends_on: [ray-head]
    cuda: ${training.cuda_visible_devices}

  - name: reef
    command: python -m reef.service
    ready: curl -sf http://127.0.0.1:${reef.port}/healthz
    ready_timeout: 120
    env:
      RAY_ADDRESS: 127.0.0.1:6379
    depends_on: [slime-driver]
