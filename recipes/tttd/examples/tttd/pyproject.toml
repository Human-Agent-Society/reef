[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-tttd-harness"
version = "0.1.0"
description = "TTT-Discover harness that talks to a Reef service"
requires-python = ">=3.12"
dependencies = [
    "reef-client",
    # Reef supplies Harbor in this environment. The "harbor" extra of reef-eval pins a version that Reef refuses.
    "reef-eval",
    "harbor",
    "numpy",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
