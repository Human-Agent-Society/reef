# Colocated Qwen3-8B LoRA stack (tttd recipe) for summary-only Guidance-TTT.
# The cardinalities and sequence limits below are deployment inputs, not
# algorithm constants; harness/harbor_agent.py holds the same values so a
# qualification and a full run cannot silently disagree.

schema-version: 2
reef:
  host: 127.0.0.1
  port: 8900
  token: reef-local
  run-dir: work/polyomino_packing/stack
  ready-timeout: 120

inference:
  num-gpus: "${training.config.num_gpus}"
  tensor-parallel-size: "1"
  options:
    context-length: "12288"
    router-port: "30000"
    mem-fraction-static: "0.5"
    disable-prefill-cuda-graph: true
    cuda-graph-max-bs-decode: "8"
  model-path: work/model
  timeout-s: 7200
  backend-factory: reef.train.slime_backend.reef_adapters.sglang.chat.SGLangChatTrainingInferenceBackend
recipe:
  implementation: recipes.tttd.recipe:TTTDRecipe
  config:
    groups-per-step: 2
    rollouts-per-group: 4
    checkpoint-every-n-versions: 2
training:
  backend: slime
  ready-timeout: 3600
  ray-namespace: reef
  ray-actor-name: reef-train-bridge
  timeout-s: 7200
  config:
    num_gpus: 2
    # The grid and model limits. harness/harbor_agent.py reads these same keys,
    # so the harness and the stack cannot disagree about the step it is running.
    steps: 1
    max_tokens: 8192
    seq_length: 12288
    lora_rank: 32
    tensor_parallel_size: 2
    checkpoint_dir: work/polyomino_packing/checkpoints

  options:
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    ref-load: "${inference.model-path}"
    save: "${training.config.checkpoint_dir}/megatron"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    save-interval: "${recipe.config.checkpoint-every-n-versions}"
    megatron-to-hf-mode: "bridge"
    num-rollout: "${training.config.steps}"
    rollout-batch-size: "${recipe.config.groups-per-step}"
    n-samples-per-prompt: "${recipe.config.rollouts-per-group}"
    global-batch-size: "8"
    disable-rollout-global-dataset: true
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "${training.config.num_gpus}"
    num-gpus-per-node: "${training.config.num_gpus}"
    colocate: true
    tensor-model-parallel-size: "${training.config.tensor_parallel_size}"
    pipeline-model-parallel-size: "1"
    context-parallel-size: "1"
    expert-model-parallel-size: "1"
    expert-tensor-parallel-size: "1"
    padded-vocab-size: "151936"
    position-embedding-type: "rope"
    rotary-base: "1000000"
    swiglu: true
    disable-bias-linear: true
    normalization: "RMSNorm"
    group-query-attention: true
    qk-layernorm: true
    seq-length: "${training.config.seq_length}"
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "12288"
    recompute-granularity: "full"
    recompute-method: "uniform"
    recompute-num-layers: "1"
    megatron-lora-rank: "${training.config.lora_rank}"
    megatron-lora-alpha: "32"
    megatron-lora-dropout: "0"
    megatron-lora-target-modules:
      - linear_qkv
      - linear_proj
      - linear_fc1
      - linear_fc2
    check-lora-weight-equal: true
    verify-lora-base-weights: true
    optimizer: "adam"
    lr: "4e-5"
    lr-decay-style: "constant"
    override-opt-param-scheduler: true
    weight-decay: "0"
    adam-beta1: "0.9"
    adam-beta2: "0.95"
    adam-eps: "1e-8"
    clip-grad: "0"
    loss-type: "custom_loss"
    custom-loss-function-path: "recipes.tttd.slime.objective.tttd_loss"
    use-rollout-logprobs: true
    advantage-estimator: "grpo"
    kl-coef: "0.1"
    custom-advantage-function-path: "recipes.tttd.slime.objective.tttd_advantages"
    entropy-coef: "0"
    rollout-temperature: "1"
    rollout-max-response-len: "8192"
    rollout-max-context-len: "12288"
    train-env-vars: "{\"PYTORCH_CUDA_ALLOC_CONF\":\"max_split_size_mb:512\"}"
    log-probs-chunk-size: "1024"
    attention-dropout: "0"
    hidden-dropout: "0"
    accumulate-allreduce-grads-in-fp32: true
    attention-softmax-in-fp32: true
    attention-backend: "flash"
storage:
  artifact-repository: work/polyomino_packing/artifacts.git
  artifact-work-dir: work/polyomino_packing/artifact-work
  artifact-cache-dir: work/polyomino_packing/artifact-cache
  agent-record-dir: work/polyomino_packing/agent-record

# Service processes launch locally; Slime owns distributed GPU model workers.
execution:
  training: ray
  rollout: ray

observability:
  wandb:
    enabled: false                     # omitted or false means no tracking
    project: reef
    # entity: your-team
    # group_prefix: guidance-ttt      # produces group guidance-ttt/<scenario>
    # name_prefix: guidance-ttt
    tags: []
    mode: online                       # online, offline, or disabled
    directory: work/polyomino_packing/wandb
    upload_checkpoints: false
