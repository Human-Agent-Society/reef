schema_version = "1.4"

artifacts = []

[task]
name = "tide/guidance-ttt-polyomino-packing"
description = "Pack polyominoes into the smallest board. A trainable Qwen policy writes only guidance; a frozen executor turns that guidance into a C++17 program that FrontierCS/go-judge scores."

[metadata]
category = "autoresearch"
author_name = "Reef"
difficulty = "hard"
tags = ["reef", "guidance-ttt", "tttd", "frontiercs", "discovery"]

[agent]
# One Harbor trial owns the complete multi-step Guidance-TTT trajectory.
timeout_sec = 604800.0

[verifier]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 4096
network_mode = "allowlist"
allowed_hosts = ["host.docker.internal"]
