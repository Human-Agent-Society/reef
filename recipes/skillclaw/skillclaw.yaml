# The recipe the campaign driver boots: run.py loads this file, builds
# the explicit implementation below, and serves it from its own embedded Reef service
# (task containers reach that service through Docker's host gateway, and
# every /v1 request they make carries the served pool's catalog).
#
# ${REEF_*} values interpolate from the environment through reef's config
# loader; run.sh exports the defaults and REEF_SC_SKILLS (the benchmark's
# shipped skills library) after materializing the WildClawBench checkout.

# The cookbook method's recipe class: the harness evolution recipe plus the
# catalog-injecting delivery surface. The entry point follows the same
# recipes.<method>.recipe convention as the other cookbook methods.
recipe:
  implementation: recipes.skillclaw.recipe:SkillClawRecipe

  config:
    evolution:
      adapter: pi
      # The night trigger: the batch closes at the frozen day's task count, passing reports included.
      batch_size: 60
      # The method in the harness/ package: the sealed night flow (one decision
      # per skill group plus the no-skill bucket) mapped to one patch of the
      # skill pool; it then runs the probe episodes and keeps their scores in
      # the step's notes.
      method: harness.plugins:NightMethod
      # The harness binary the probe episodes run headless, from the environment.
      binary: ${REEF_PI_BINARY}
      # The bootstrap pool: each <name>/SKILL.md under this directory - the
      # benchmark's shipped skills library, the sealed campaign's day-one pool -
      # joins the first tree as skills/<name>/SKILL.md. Empty (unset) seeds no
      # skills. The first tree carries no provider: the driver (run.py) hands
      # the recipe its model binding, which reef renders into each probe
      # episode and passes to the night. The served pool never names an endpoint.
      seed_skills: ${REEF_SC_SKILLS}
      # Each scenario's proposals, history (the score cache) and step records,
      # relative to the directory run.sh starts the driver in: this example's
      # ./work, beside the campaign.
      state_dir: work/harness
      evaluation:
        # The SkillClaw regime: every non-skip night publishes. The probe
        # scores do not decide which changes are published; the next day's
        # traffic judges the pool.
        policy: none
        # Grades the probe episodes by their exact final answer.
        scorer: harness.plugins:ProbeScorer
        # Three exact-answer probe tasks. Each prefix keys the expected answer
        # in harness/skillclaw.py's answer table; each prompt pins the format the
        # grader checks (the answer alone on the last line).
        tasks:
          - >-
            [sieve] Write and mentally run a prime sieve: how many primes are below 100000? Reply with the count as a
            plain integer alone on the last line.
          - >-
            [fib] With fib(1) = 1 and fib(2) = 1, compute fib(90) exactly (memoize, do not approximate). Reply with the
            value as a plain integer alone on the last line.
          - |-
            [csv] Compute the median of the value column in this csv:
            id,value
            1,12
            2,47
            3,3
            4,88
            5,21
            6,56
            7,9
            8,74
            9,30
            Reply with the median as a plain integer alone on the last line.
inference:
  upstream-model: ${REEF_MODEL}

execution:
  evolution:
    workers: 1  # Auto selects uni for one CPU worker, mp for multiple workers.
