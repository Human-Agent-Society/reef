# A Qwen3-8B-Base OpenThoughts3 SFT student with a fresh rank/alpha 128 adapter, distilled from the
# Qwen3-32B teacher engine on eight GPUs: the TP2 actor on two, four single-GPU rollout engines on
# four, and the TP2 teacher engine on the other two. Mount model and experiment directories at
# /work. See README.md.
reef:
  ready-timeout: 3600
  host: 127.0.0.1
  port: 8900
  run-dir: ${OPD_RUN_DIR:?}/runtime
  token: ${REEF_TOKEN}
inference:
  model-path: ${OPD_MODEL_PATH:?}
  # A 30720-token evaluation response can wait over an hour behind the other requests when the KV
  # cache is full, so the request deadline covers that queue and the full decode.
  timeout-s: 10800
  num-gpus: 4
  tensor-parallel-size: 1
  options:
    router-port: 23000
    # Qwen3-8B's native window; the evaluation budget leaves 2048 tokens of it for the prompt.
    context-length: 32768
    dtype: bfloat16
    # A request the engine retracts under memory pressure re-prefills its generated tokens with
    # input log-probs, so keep that chunk's full-vocabulary logits small and leave headroom for them.
    chunked-prefill-size: 2048
    mem-fraction-static: 0.80
    disable-cuda-graph: true
    enable-deterministic-inference: true
  handler-factory: reef.inference.sglang.chat.SGLangInferenceHandler
  handler-config:
    sampling_defaults:
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.0
      max_new_tokens: 16384
recipe:
  implementation: recipes.opd.recipe:OPDRecipe
  config:
    max-staleness: 0
    checkpoint-every-n-versions: 1000
pipeline:
  record2task:
    config:
      max_teacher_tokens: 32768
  task2batch:
    config:
      batch_size: 256                  # run.py's prompts per step times samples per prompt
training:
  backend: slime
  colocate: false
  ready-timeout: 1800
  ray-address: local
  ray-namespace: reef-opd-engine
  ray-actor-name: reef-opd-engine-bridge
  timeout-s: 7200
  config:
    checkpoint_dir: ${OPD_RUN_DIR:?}/checkpoints
    checkpoint_retention:
      max_storage: 600GB
      max_storage_fraction: 0.8
      min_free_space: 100GB
      policy: latest
    global_batch_size: 256
  options:
    reef-checkpoint-max-storage: ${training.config.checkpoint_retention.max_storage}
    reef-checkpoint-max-storage-fraction: ${training.config.checkpoint_retention.max_storage_fraction}
    reef-checkpoint-min-free-space: ${training.config.checkpoint_retention.min_free_space}
    reef-checkpoint-policy: ${training.config.checkpoint_retention.policy}
    megatron-to-hf-mode: bridge
    hf-checkpoint: ${inference.model-path}
    # Qwen3 checkpoints pad the embedding to 151936 rows beyond the tokenizer's 151669 ids.
    vocab-size: 151936
    load: ${training.config.checkpoint_dir}/megatron
    save: ${training.config.checkpoint_dir}/megatron
    save-interval: 10
    save-hf: ${training.config.checkpoint_dir}/hf/{rollout_id}
    num-rollout: '100000000'
    rollout-batch-size: ${training.config.global_batch_size}
    global-batch-size: ${training.config.global_batch_size}
    micro-batch-size: '1'
    actor-num-nodes: '1'
    actor-num-gpus-per-node: 2
    num-gpus-per-node: 8
    tensor-model-parallel-size: 2
    pipeline-model-parallel-size: '1'
    context-parallel-size: '1'
    seq-length: 32768
    rollout-max-response-len: 16384
    rollout-max-context-len: 32768
    disable-bias-linear: true
    qk-layernorm: true
    group-query-attention: true
    normalization: RMSNorm
    norm-epsilon: 1e-6
    position-embedding-type: rope
    rotary-percent: 1.0
    rotary-base: 1000000
    swiglu: true
    recompute-granularity: full
    recompute-method: uniform
    recompute-num-layers: '1'
    use-dynamic-batch-size: true
    sequence-parallel: true
    max-tokens-per-gpu: 32768
    log-probs-chunk-size: '512'
    ckpt-fully-parallel-save: true
    attention-dropout: '0.0'
    hidden-dropout: '0.0'
    attention-softmax-in-fp32: true
    accumulate-allreduce-grads-in-fp32: true
    attention-backend: flash
    optimizer: adam
    lr: 5e-5
    lr-decay-style: constant
    weight-decay: '0.0'
    clip-grad: '1.0'
    adam-beta1: '0.9'
    adam-beta2: '0.95'
    loss-type: custom_loss
    use-rollout-logprobs: true
    disable-compute-advantages-and-returns: true
    opd-teacher: separate
    opd-teacher-update-rate: '0'
    opd-divergence: reverse
    opd-top-k: '1'
    opd-importance-sampling-cap: '0'
    n-samples-per-prompt: '1'
    rollout-temperature: '1.0'
    megatron-lora-rank: 128
    megatron-lora-alpha: 128
    megatron-lora-dropout: '0'
    megatron-lora-target-modules:
    - linear_qkv
    - linear_proj
    - linear_fc1
    - linear_fc2
    check-lora-weight-equal: true
    verify-lora-base-weights: true
storage:
  artifact-repository: ${OPD_RUN_DIR:?}/artifacts.git
  artifact-work-dir: ${OPD_RUN_DIR:?}/artifact-work
  artifact-cache-dir: ${OPD_RUN_DIR:?}/artifact-cache
  agent-record-dir: ${OPD_RUN_DIR:?}/agent-record
execution:
  training: ray
  rollout: ray
observability:
  wandb:
    enabled: false
teacher:
  model-path: ${OPD_TEACHER_PATH:?}
  num-gpus: 2
  port: 30001
  timeout: 600
  options:
    dtype: bfloat16
    context-length: 32768
    chunked-prefill-size: 2048
    mem-fraction-static: 0.80
    disable-cuda-graph: true
