version = "1.3"

[metadata]
author_name = "Reef"
category = "coding"
tags = ["agentcl", "codeeval-pro"]

[agent]
timeout_sec = 600.0
network_mode = "no-network"
user = "student"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "no-network"

[verifier]
timeout_sec = 90.0
environment_mode = "separate"
network_mode = "no-network"
user = "root"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "no-network"

[[artifacts]]
source = "/workspace/answer.py"
destination = "answer.py"
