version = "1.0"

[metadata]
author_name = "Reef"
benchmark = "sdpo-sciknoweval"
difficulty = "hard"
category = "reinforcement-learning"
tags = ["reef", "harbor", "sdpo", "sciknoweval", "chemistry"]

[verifier]
# The verifier reads the run's curve; no model calls happen here.
timeout_sec = 300.0

[agent]
# Every step is a 32x8 sampling grid, one optimizer step and a weight release,
# with an avg@16 evaluation of 210 questions every five steps; the harness runs
# the whole run as one exec inside this container.
timeout_sec = 172800.0

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 4096
storage_mb = 8192
gpus = 0
