[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-sdpo-arithmetic-grid-harness"
version = "0.1.0"
description = "Harbor agent harness that runs the SDPO grid runner against a Reef service"
requires-python = ">=3.12"
dependencies = [
    "reef-client",
    "reef-eval[harbor]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
