version = "1.0"

[metadata]
author_name = "Reef"
benchmark = "sdpo-arithmetic-grid"
difficulty = "easy"
category = "integration"
tags = ["reef", "harbor", "sdpo"]

[verifier]
# The verifier reads the run's record; no model calls happen here.
timeout_sec = 60.0

[agent]
# Every step is a complete sampling grid, one optimizer step and a weight
# release; the harness runs the whole run as one exec inside this container.
timeout_sec = 14400.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 2048
gpus = 0
