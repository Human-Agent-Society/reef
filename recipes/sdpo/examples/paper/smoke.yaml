# Synthetic two-step qualification on 4 GPUs; not paper hyperparameters.
schema-version: 2
reef:
  host: 127.0.0.1
  port: 28902
  token: reef-local-smoke
  ready-timeout: 1800
  run-dir: /tmp/reef-sdpo-smoke/run
inference:
  model-path: /tmp/models/Qwen3-0.6B
  timeout-s: 1200
  num-gpus: "4"
  tensor-parallel-size: "1"
  options:
    router-port: "23002"
    context-length: "2048"
    mem-fraction-static: "0.4"
  handler-factory: reef.inference.sglang.chat.SGLangInferenceHandler
  handler-config:
    sampling_defaults:
      top_k: -1
      repetition_penalty: 1.0
recipe:
  implementation: recipes.sdpo.recipe:SDPORecipe
  config:
    tokenizer-path: /tmp/models/Qwen3-0.6B
    groups-per-step: 2
    rollouts-per-group: 2
    max-staleness: 0
    max-teacher-prompt-tokens: 512
    max-teacher-tokens: 2048
    include-environment-feedback: true
    checkpoint-every-n-versions: 1000
training:
  backend: slime
  colocate: true
  ready-timeout: 1800
  timeout-s: 1800
  config:
    checkpoint_dir: /tmp/reef-sdpo-smoke/checkpoints
    global_batch_size: 4
  options:
    megatron-to-hf-mode: bridge
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    save: "${training.config.checkpoint_dir}/megatron"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    save-interval: "1000"
    num-rollout: "1000"
    rollout-batch-size: "4"
    global-batch-size: "4"
    micro-batch-size: "1"
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "4"
    num-gpus-per-node: "4"
    tensor-model-parallel-size: "4"
    pipeline-model-parallel-size: "1"
    context-parallel-size: "1"
    seq-length: "2048"
    rollout-max-response-len: "128"
    rollout-max-context-len: "2048"
    num-layers: "28"
    hidden-size: "1024"
    ffn-hidden-size: "3072"
    num-attention-heads: "16"
    group-query-attention: true
    num-query-groups: "8"
    kv-channels: "128"
    padded-vocab-size: "151936"
    position-embedding-type: rope
    rotary-base: "1000000"
    norm-epsilon: "0.000001"
    swiglu: true
    disable-bias-linear: true
    qk-layernorm: true
    normalization: RMSNorm
    attention-dropout: "0.0"
    hidden-dropout: "0.0"
    attention-softmax-in-fp32: true
    accumulate-allreduce-grads-in-fp32: true
    attention-backend: flash
    sequence-parallel: true
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "4096"
    log-probs-chunk-size: "128"
    optimizer: adam
    lr: "0.00001"
    lr-decay-style: constant
    weight-decay: "0.01"
    clip-grad: "1.0"
    loss-type: custom_loss
    use-rollout-logprobs: true
    disable-compute-advantages-and-returns: true
    num-steps-per-rollout: "1"
    n-samples-per-prompt: "1"
    rollout-temperature: "1.0"
storage:
  artifact-repository: /tmp/reef-sdpo-smoke/artifacts.git
  artifact-work-dir: /tmp/reef-sdpo-smoke/artifact-work
  artifact-cache-dir: /tmp/reef-sdpo-smoke/artifact-cache
  agent-record-dir: /tmp/reef-sdpo-smoke/agent-record
execution:
  training: ray
  rollout: ray
observability:
  wandb:
    enabled: false
