[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-sao-harness"
version = "0.1.0"
description = "SAO functional smoke Harbor agent harness that talks to a Reef service"
requires-python = ">=3.10"
dependencies = ["reef-client", "reef-eval[harbor]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
