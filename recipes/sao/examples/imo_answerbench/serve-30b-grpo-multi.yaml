# GRPO(+DIS) control at the paper's batch: 16 prompts x 8 rollouts = 128 per
# step (§4.1), same topology as serve-30b-multi.yaml (SAO_TRAIN_NODES training nodes,
# SAO_ROLLOUT_GPUS engine GPUs on other nodes, TP4 engines), group-relative
# baseline and no critic. stream.py runs 16 groups at once and posts each
# group's eight reports together.

schema-version: 2
reef:
  host: 127.0.0.1
  port: 8900
  token: reef-local
  run-dir: work/stack
  ready-timeout: 3600

inference:
  num-gpus: "${SAO_ROLLOUT_GPUS}"
  tensor-parallel-size: "4"
  timeout-s: 1800
  retry-timeout-s: 7200
  retry-max-s: 60
  options:
    router-port: "30000"
    disable-radix-cache: true
    incremental-streaming-output: true
    # Eight concurrent 61k-token rollouts: the KV pool must leave room for the
    # prefill logits of a chunk (all-gathered across TP with return_logprob),
    # which is what ran out of memory at the default fraction after the first
    # weight update.
    mem-fraction-static: "0.8"
    chunked-prefill-size: "8192"
    max-running-requests: "32"
  model-path: ~/models/Qwen3-30B-A3B-Thinking-2507
recipe:
  implementation: recipes.sao.recipe:SAOGrpoControlRecipe
  config:
    batch-size: ${SAO_BATCH}           # MUST equal training.config.global_batch_size; a multiple of SAO_GROUP
    max-staleness: 4
    # Artifacts are full model copies. Publishing one paused generation long enough for the
    # SGLang scheduler watchdog (300 s) to kill the engines; keep the HF exports instead.
    checkpoint-every-n-versions: 100000
training:
  backend: slime
  colocate: false
  ready-timeout: 1800
  timeout-s: 14400
  config:
    checkpoint_dir: ${SAO_CKPT_DIR}
    global_batch_size: ${SAO_BATCH}
  options:
    megatron-to-hf-mode: "bridge"
    load: "${training.config.checkpoint_dir}/megatron"
    save: "${training.config.checkpoint_dir}/megatron"
    save-interval: "100000"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    num-rollout: "100000000"
    rollout-batch-size: "${training.config.global_batch_size}"
    global-batch-size: "${training.config.global_batch_size}"
    micro-batch-size: "1"
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "32768"
    log-probs-max-tokens-per-gpu: "32768"
    padded-vocab-size: "151936"
    position-embedding-type: "rope"
    swiglu: true
    disable-bias-linear: true
    qk-layernorm: true
    normalization: "RMSNorm"
    moe-token-dispatcher-type: "alltoall"
    moe-router-topk: "8"
    moe-grouped-gemm: true
    moe-router-dtype: "fp32"
    moe-permute-fusion: true
    moe-aux-loss-coeff: "0"
    actor-num-nodes: "${SAO_TRAIN_NODES}"
    actor-num-gpus-per-node: "8"
    num-gpus-per-node: "8"
    tensor-model-parallel-size: "8"
    pipeline-model-parallel-size: "1"
    expert-model-parallel-size: "8"
    expert-tensor-parallel-size: "1"
    sequence-parallel: true
    recompute-granularity: "full"
    recompute-method: "uniform"
    recompute-num-layers: "1"
    seq-length: "28672"
    rollout-max-response-len: "24576"
    optimizer: "adam"
    no-save-optim: true
    # The coordinator verifies the exports from wherever Reef schedules it, so
    # the README runs kept SAO_CKPT_DIR on shared storage; keep its footprint
    # bounded by pruning old exports.
    reef-checkpoint-max-storage: "1500GB"
    lr: "1e-6"
    lr-decay-style: "constant"
    loss-type: "policy_loss"
    use-rollout-logprobs: true
    eps-clip: "0.3"
    eps-clip-high: "5.0"
    gamma: "1.0"
    lambd: "1.0"
    entropy-coef: "0.0"
    n-samples-per-prompt: "${SAO_GROUP}"
    advantage-estimator: "grpo"
storage:
  # Every update publishes a full copy of the model (tens of GB); keep the
  # artifact repository and caches beside the checkpoints on local disk.
  artifact-repository: ${SAO_CKPT_DIR}/artifacts.git
  artifact-work-dir: ${SAO_CKPT_DIR}/artifact-work
  artifact-cache-dir: ${SAO_CKPT_DIR}/artifact-cache
  agent-record-dir: work/agent-record
observability:
  wandb:
    enabled: false
    project: reef
    tags: []
    mode: online
    directory: work/wandb
    upload_checkpoints: false
