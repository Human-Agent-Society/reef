# OpenClaw-RL on Apple Silicon: the policy serves and trains in this process.
#
# The sibling serve.yaml is the reference deployment: seven GPUs, Megatron on
# four, a rollout engine, a served PRM, and a 32B student. This deployment runs
# the policy in the Reef process on MLX. The PRM votes and the student
# reactions need only text, so a hosted model supplies both.
#
# Run Reef on the host, not in the compose stack: run `reef serve -c` with this
# file, then point the harness at the machine's LAN address. The task containers
# reach the service over that interface, so `reef.host` binds 0.0.0.0.
#
# The paths below are relative to the working directory of the process. Two
# runs from the same directory share one artifact repository, and Reef refuses
# the second with "training is already bound to scenario". Give each run its
# own `run-dir` and `storage` paths, or start each run in its own directory.

reef:
  host: 0.0.0.0
  port: 8904
  token: reef-local
  run-dir: work/mlx/stack
  ready-timeout: 1800

inference:
  # The engine loads the model from a local path or the Hub. There is no
  # separate inference service.
  model-path: mlx-community/Qwen3.5-9B-MLX-4bit

training:
  backend: mlx
  options:
    checkpoint_dir: work/mlx/checkpoints
    # Every layer trains. The 9B model has 32 layers, and 24 are GatedDeltaNet
    # layers, whose kernel has no vjp. In training mode the engine runs that
    # recurrence chunkwise. With checkpoint_layers, it recomputes the forward
    # pass of each layer in the backward pass, so the gradient reaches all 32.
    lora_layers: 32
    lora_rank: 64
    checkpoint_layers: true
    # Adapting k_proj and v_proj rules out a cached prompt prefill, because the
    # cache would freeze tensors that depend on trained weights. in_proj_qkv is
    # the projection of the GatedDeltaNet layers. Without it, the gradient
    # passes through those layers but does not train them.
    lora_keys:
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - linear_attn.in_proj_qkv
    learning_rate: 3.0e-5
    max_tokens: 2048
    # Chunk the [response, vocab] head so the backward pass of a long response
    # fits in memory.
    log_probs_chunk_size: 512
    # The top-K tokens that the policy considered at generation time. The
    # openclawrl objective distils onto these candidates, and they cannot be
    # rebuilt after generation.
    capture_topk: 4
    # The weight of a penalty on drift from the frozen base policy. Neither
    # objective term limits that drift. Each loss family applies the penalty in
    # its own way. The openclawrl objective that this recipe selects adds a KL
    # term to the loss, as the slime reference does. Set `loss_options.kl_coef`
    # to set that term separately.
    kl_coef: 0.05

recipe:
  implementation: recipes.openclawrl.recipe:OpenClawRLRecipe
  config:
    checkpoint-every-n-versions: 1

pipeline:
  # The judging stage: sessions correlated, and each turn judged by the PRM.
  record2record:
    config:
      # The idle time in seconds before a session expires. It must exceed the
      # longest gap between a reply and the student reaction that judges it.
      # An expired session cannot bind the two, so the reply drops untrained.
      # Hermes runs each turn as a new process, so only the session tag links
      # the reply and the reaction.
      #
      # Allow for one generation, the student round trip, and one training
      # step, which blocks the engine. On this runtime each of these can take
      # minutes. A longer value only delays the retirement of the last turn of
      # a finished session. See results/ for the measured gaps.
      session_ttl_s: 1800
      prm_url: https://openrouter.ai/api/v1/chat/completions
      prm_api: openai
      prm_model: z-ai/glm-5.3
      # Reef reads the credential from this environment variable. The config
      # never holds it.
      prm_api_key_env: OPENROUTER_API_KEY
      prm_m: 3
      # GLM-5.3 always reasons, and the reasoning counts against this budget.
      # If the budget is too small, the vote returns no content and fails
      # without an error. Keep room for the reasoning and the answer.
      prm_max_tokens: 16384
      # The tokenizer of the policy. The teacher renders hint-enhanced prompts
      # with it for every prm_api.
      prm_tokenizer_path: mlx-community/Qwen3.5-9B-MLX-4bit
  task2batch:
    config:
      # Judged turns per optimizer step. The reference uses 16. A value of 8
      # gives a 72-session stream twice the steps on one machine, but each
      # gradient is noisier.
      batch_size: 8

storage:
  agent-record-dir: work/mlx/agent-record
  artifact-repository: work/mlx/artifacts.git
  artifact-work-dir: work/mlx/artifact-work
  artifact-cache-dir: work/mlx/artifact-cache

# Candidate evaluation: each candidate runs a fixed style probe before Reef
# publishes it. Reef does not publish a candidate whose clean rate drops more
# than the margin below the best. Without this section, Reef uses the `always`
# policy and publishes every step.
#
# The probe generates from the weights of the candidate, so it needs a training
# runtime that holds an unpublished candidate, such as this one. Reef refuses a
# runtime whose candidates are in another process.
evaluation:
  module: recipes.openclawrl.candidate_evaluator:OpenClawRLCandidateEvaluation
  config:
    probe_size: 8
    # The generation budget for one probe reply. Make it large enough for a
    # full reply with its arithmetic. A cut reply can fail the shown-work check
    # because of its length, not its style.
    max_tokens: 320
    # The allowed drop of the clean rate below the best selected candidate.
    # One probe problem is worth 1 / probe_size, which is 0.125 here. A margin
    # of 0.17 accepts a drop of one problem and refuses a drop of two or more.
    # The check stops a collapse, not small changes between steps.
    regression_margin: 0.17
