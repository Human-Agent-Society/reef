# OpenClawRL owns PRM and user-model startup, health checks and GPU isolation.
# Reef coordinates only its inference/training runtime. Task environments have
# separate Compose files under harbor-tasks/.
# run.sh supplies image, paths and a per-run REEF_TOKEN.
services:
  reef:
    image: ${REEF_IMAGE}
    container_name: reef-openclawrl
    depends_on:
      prm:
        condition: service_healthy
    command: reef serve -c /workspace/Reef/${REEF_CONFIG}
    # Host networking: the per-task containers reach reef on the machine's IP,
    # and slime binds the training engines' router to that same IP.
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Slime alone uses this pool: four actor GPUs and one rollout GPU.
              device_ids: ["3", "4", "5", "6", "7"]
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR}:/root/models
      - ${RUN_DIR}:/var/lib/reef
      - ${REEF_ROOT}:/workspace/Reef
    environment:
      # Optional external cluster; empty means Reef owns a local runtime.
      RAY_ADDRESS: ${RAY_ADDRESS:-}
      REEF_TOKEN: ${REEF_TOKEN}
      PYTHONPATH: /workspace/Reef:/root/Megatron-LM
      WANDB_API_KEY: ${WANDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:28900/healthz"]
      interval: 10s
      timeout: 5s
      # The full stack boots in ~6 minutes on B200s; 120 x 10s is the ceiling.
      retries: 120
      start_period: 30s

  prm:
    image: ${REEF_IMAGE}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /root/models/Qwen3-4B-Thinking-2507
      - --host
      - 0.0.0.0
      - --port
      - "23001"
      - --tp
      - "1"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR}:/root/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:23001/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s

  user-model:
    image: ${REEF_IMAGE}
    command:
      - python
      - -m
      - sglang.launch_server
      - --model-path
      - /root/models/Qwen3-32B
      - --served-model-name
      - qwen3-32b-user-llm
      - --host
      - 0.0.0.0
      - --port
      - "30001"
      - --tp
      - "1"
    network_mode: host
    ipc: host
    shm_size: 32gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - ${MODEL_DIR}:/root/models
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:30001/health"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30s
