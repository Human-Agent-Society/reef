# Reefine (beta). From the repository root, with PYTHONPATH set to the checkout:
#   reef serve -c recipes/beta/reefine/examples/configs/serve.yaml --model ollama/gemma4:26b
reef:
  host: 127.0.0.1
  port: 8901
  # Unset REEF_TOKEN leaves the loopback service without authentication; set it to require a Bearer token.
  token: ${REEF_TOKEN}
  run-dir: ~/.reef/reefine/stack

recipe:
  implementation: recipes.beta.reefine:ReefineRecipe
  # The recipe uses the upstream runtime's model for evaluation as well as serving.

  config:
    evolution:
      adapter: pi
      # The recipe's method, recipes.beta.reefine:ReefineMethod, answers each request. A coding agent (pi) does
      # it: the agent edits the step's tree, runs the changed harness to prove it, and stops. Jailed with
      # bubblewrap and pasta where the host has them; without them the served model answers in text, unless
      # agent.sandbox (or REEF_AGENT_SANDBOX) is a cloud sandbox (e2b with E2B_API_KEY, or modal with Modal's
      # token), or none, which runs the agent unisolated (trusted clients only).
      agent:
        timeout_s: 1800
        trial_timeout_s: 300
      # Images, embeddings, speech and decisions: Reef relays the harness's calls to this gateway with its key,
      # unrecorded. The key is REEF_MULTIMODAL_API_KEY or --recipe.config.evolution.multimodal.api_key, else the
      # upstream's when the upstream is this gateway; without one those routes answer 501. For another gateway:
      # preset: openai-compatible and its url.
      multimodal:
        preset: openrouter
        api_key: ${REEF_MULTIMODAL_API_KEY}
      # An evolved extension runs in pi's process with your privileges, so it waits for a promote.
      review_parts: [extension]
      # Each step's workspace (its tree, material, calls and output) and the history of every candidate, one
      # directory per scenario. It stays outside the
      # checkout: with agent.sandbox none the agent works in a step's directory, and pi reads every AGENTS.md
      # and CLAUDE.md in the directories above it.
      state_dir: ~/.reef/reefine/harness
      # No binary: at startup reef installs the descriptor's pinned pi under
      # ~/.local/share/reef-harness/pi. Set evolution.binary to a path to use an install of your own instead.
      evaluation:
        # The floor runs the candidate alone on the health task and publishes it when the task passes: it checks
        # that the tree still works (the model binding, the tools, the extensions load), not that the requested
        # change does; the step page's design and review and the person judge the change itself.
        policy: floor
        scorer: recipes.beta.reefine.scorer:AnswerScorer
        # On an adapter whose prompt is a Harbor task directory (terminus), the recipe runs the health task as
        # the directory recipes/beta/reefine/health instead, scored by its verifier's reward.
        tasks:
          - '[health] Run the shell command `echo reef-ok` with your shell tool and reply with its exact output
            as a plain word alone on the last line.'
      # No seed: the first tree is the recipe's own (recipes/beta/reefine/seed), the starter skill.
    # One step per instruction and no failure driven step between them: the measurement counts a step per request.
    training-mode: manual

inference:
  upstream-url: ${REEF_UPSTREAM_URL:?}
  upstream-model: ${REEF_UPSTREAM_MODEL:?}
  upstream-api-key: ${REEF_UPSTREAM_API_KEY}
storage:
  agent-record-dir: ~/.reef/reefine/agent-record
  artifact-repository: ~/.reef/reefine/artifacts.git
  artifact-work-dir: ~/.reef/reefine/artifact-work
  artifact-cache-dir: ~/.reef/reefine/artifact-cache
