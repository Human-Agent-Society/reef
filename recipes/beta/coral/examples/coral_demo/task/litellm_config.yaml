# CORAL gateway upstreams for the Reef TTT example. All aliases route to the
# single Reef-served policy. The hosted_vllm provider tells LiteLLM the
# upstream is an OpenAI-compatible chat server, so Responses API calls from
# opencode (@ai-sdk/openai >= 1.x) are translated to /chat/completions
# instead of being forwarded to a /responses endpoint reef does not have.
model_list:
  - model_name: reef-policy
    litellm_params: &reef
      model: hosted_vllm/reef-policy
      api_base: os.environ/REEF_API_BASE
      api_key: os.environ/REEF_TOKEN
  - model_name: claude-opus-4-6
    litellm_params: *reef
  - model_name: gpt-5.4
    litellm_params: *reef
  - model_name: gpt-5.4-nano
    litellm_params: *reef

litellm_settings:
  drop_params: true
  # Surface the upstream response headers (prefixed) so the reef layer can
  # capture the x-reef-agent-record-id / x-reef-release-id receipts.
  return_response_headers: true
