# Colocated Qwen3-Coder-30B-A3B (MoE) LoRA stack for the CORAL benchmark runs.
# One 8-GPU node per task: TP8/EP8 Megatron actor colocated with an 8-GPU
# SGLang engine. Derived from serve.yaml (schema 2) plus the 30B MoE knobs.

schema-version: 2
service:
  host: 127.0.0.1
  port: 8900
  token: reef-local
  run-dir: ${CORAL_TTT_STATE_DIR}/stack
  ready-timeout: 3600

inference:
  model-path: /fsx/xuanj/models/Qwen3-Coder-30B-A3B-Instruct
  timeout-s: 7200
  backend-factory: reef.train.slime_backend.reef_adapters.sglang.chat.SGLangChatTrainingInferenceBackend
  backend-config:
    tool_call_parser: qwen3_coder
recipe:
  implementation: recipes.beta.coral.recipe:CoralRecipe
  config:
    group-size: 2
    group-by: release
    checkpoint-every-n-versions: 1
training:
  ray-namespace: reef
  ray-actor-name: reef-train-bridge
  timeout-s: 14400
  config:
    num_gpus: 8
    steps: 64
    max_new_tokens: 8192
    checkpoint_dir: ${CORAL_TTT_STATE_DIR}/checkpoints
    checkpoint_retention:
      max_storage_fraction: 0.8
      min_free_space_fraction: 0.1
      policy: latest

  options:
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    ref-load: "${inference.model-path}"
    save: "${training.config.checkpoint_dir}/megatron"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    save-interval: "${recipe.config.checkpoint-every-n-versions}"
    megatron-to-hf-mode: "bridge"
    reef-checkpoint-max-storage-fraction: "${training.config.checkpoint_retention.max_storage_fraction}"
    reef-checkpoint-min-free-space-fraction: "${training.config.checkpoint_retention.min_free_space_fraction}"
    reef-checkpoint-policy: "${training.config.checkpoint_retention.policy}"
    num-rollout: "${training.config.steps}"
    rollout-batch-size: "2"
    n-samples-per-prompt: "${recipe.config.group-size}"
    global-batch-size: "4"
    micro-batch-size: "1"
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "${training.config.num_gpus}"
    rollout-num-gpus: "${training.config.num_gpus}"
    rollout-num-gpus-per-engine: "1"
    num-gpus-per-node: "${training.config.num_gpus}"
    colocate: true
    tensor-model-parallel-size: "8"
    pipeline-model-parallel-size: "1"
    expert-model-parallel-size: "8"
    expert-tensor-parallel-size: "1"
    sequence-parallel: true
    padded-vocab-size: "151936"
    position-embedding-type: "rope"
    swiglu: true
    disable-bias-linear: true
    qk-layernorm: true
    normalization: "RMSNorm"
    moe-token-dispatcher-type: "alltoall"
    moe-router-topk: "8"
    moe-grouped-gemm: true
    moe-router-dtype: "fp32"
    moe-permute-fusion: true
    moe-aux-loss-coeff: "0"
    recompute-granularity: "full"
    recompute-method: "uniform"
    recompute-num-layers: "1"
    megatron-lora-rank: "32"
    megatron-lora-alpha: "32"
    megatron-lora-target-modules:
      - linear_qkv
      - linear_proj
    optimizer: "adam"
    lr: "4e-5"
    lr-decay-style: "constant"
    loss-type: "custom_loss"
    use-rollout-logprobs: true
    kl-coef: "0.1"
    rollout-temperature: "1"
    rollout-max-response-len: "8192"
    seq-length: "131072"
    max-tokens-per-gpu: "131072"
    log-probs-chunk-size: "512"
storage:
  artifact-repository: ${CORAL_TTT_STATE_DIR}/artifacts.git
  artifact-work-dir: ${CORAL_TTT_STATE_DIR}/artifact-work
  artifact-cache-dir: ${CORAL_TTT_STATE_DIR}/artifact-cache
  agent-record-dir: ${CORAL_TTT_STATE_DIR}/agent-record

execution:
  training: ray
  rollout: ray

observability:
  wandb:
    enabled: false
    project: reef
    directory: ${CORAL_TTT_STATE_DIR}/wandb

services:
  - name: slime-driver
    command:
      - ${REEF_PYTHON}
      - -m
      - reef.service.slime_driver
    ready: test -f "$REEF_BRIDGE_READY_FILE"
    ready_timeout: 3600
    env:
      REEF_RAY_NAMESPACE: reef
      REEF_RAY_ACTOR_NAME: reef-train-bridge
      CUDA_DEVICE_MAX_CONNECTIONS: "1"
      NCCL_NVLS_ENABLE: "0"

  - name: reef
    command: ["${REEF_PYTHON}", "-m", "reef.service"]
    ready: curl -sf http://127.0.0.1:${service.port}/healthz
    ready_timeout: 120
    depends_on: [slime-driver]
