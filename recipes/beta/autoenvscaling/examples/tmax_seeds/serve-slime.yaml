# AutoEnvScaling on Slime from a seed pool: Qwen3.5-9B trains all its weights on TMax seed tasks, and Claude Code writes a
# harder or simpler variant of each seed the model solves too often or too rarely. The generated-task recipe trains them.
# The tasks, the Designer and the agent are those of serve-tinker.yaml beside this file; Slime's own GRPO loop trains.
# One Linux node with 8 GPUs of 80 GB (H100): 4 for the Megatron actor (TP2 with sequence parallelism, CP2), 3 for Slime's
# rollout engines, and 1 for Reef's serving engine. Run it in the Reef image (docker/README.md).
# Supply REEF_TOKEN, E2B_API_KEY and CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`) through the shell.
# REEF_AUTOENVSCALING_STATE_DIR is where this deployment keeps its state; REEF_AUTOENVSCALING_SEEDS_PATH is the seed
# directory that `python -m recipes.beta.autoenvscaling.tmax` wrote; REEF_AUTOENVSCALING_MODEL_PATH is a local copy of
# Qwen/Qwen3.5-9B (`hf download Qwen/Qwen3.5-9B --local-dir <path>`). Export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
# too: the trainer runs out of memory on a long sample without it.
reef:
  host: 127.0.0.1
  port: 8900
  token: ${REEF_TOKEN}
  run-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/stack
  # The serving engine loads the model, and Slime starts its actor and rollout engines, before /healthz answers.
  ready-timeout: 3600
inference:
  model-path: ${REEF_AUTOENVSCALING_MODEL_PATH}
  # How long Reef's inference route waits for one reply; a reply may be 16384 tokens.
  timeout-s: 1800
  num-gpus: 1
  tensor-parallel-size: 1
  options:
    # Reef's serving engine and Slime's rollout engines each have a router; they need different ports.
    router-port: 31100
    # A 64K window: a rollout ends at a history of 65536 - 16384 tokens, since SGLang refuses a longer prompt.
    context-length: 65536
    attention-backend: flashinfer
# The generator service: checks the seeds and the variants and runs the calibration rollouts, with the harbor command line.
generator:
  tasks-root: ${REEF_AUTOENVSCALING_STATE_DIR}/tasks
  # The checks and the calibration rollouts run in E2B, so the host needs no Docker for the tasks.
  environment: e2b
  # Calibration rollouts in flight.
  concurrency: 8
  # The agent of the calibration rollouts: the training rollouts' agent, so both measure the same thing.
  agent:
    # A training rollout whose context fills ends and is scored; terminus-2 gives it no reward, which trains as 0.
    import_path: reef.record2sample.generator.terminus:VerifiedTerminus2
    model_name: openai/{model}
    kwargs:
      api_base: "{base_url}/v1"
      # The tasks have no network: on e2b the recorder's install hangs the rollout.
      record_terminal_session: false
      # No compaction, as the official AutoEnvScaling solver: a summarized history does not assemble into one sample.
      enable_summarize: false
      # Only the limit Harbor names to the model after a cut reply; on chat completions it caps nothing.
      model_info: {max_input_tokens: 48000, max_output_tokens: 16384, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
      llm_kwargs:
        api_key: "{api_key}"
        # The cap of one reply, as the official solver.
        max_tokens: 16384
        # Thinking off: a thinking model's rollout trains only its last turn.
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
recipe:
  implementation: reef.recipe.generated_tasks:GeneratedTaskRecipe
  config:
    job_parameters:
      # Slime's own loop trains the rollouts: each task is one prompt group of n-samples-per-prompt rollouts.
      objective: slime_dataset
      # The Harbor rollouts inside Slime's loop, on Slime's rollout engines at the job's start weights.
      harbor:
        # Rollouts in flight, each in its own E2B sandbox.
        concurrency: 24
        environment: e2b
        # Qwen3.5 with thinking off ends each generation prompt with an empty think block the history drops.
        scaffold_tolerance: 8
        # The Reasoning Agent: the same agent as generator.agent.
        agent:
          import_path: reef.record2sample.generator.terminus:VerifiedTerminus2
          model_name: openai/{model}
          kwargs:
            api_base: "{base_url}/v1"
            record_terminal_session: false
            enable_summarize: false
            model_info: {max_input_tokens: 48000, max_output_tokens: 16384, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
            llm_kwargs:
              api_key: "{api_key}"
              max_tokens: 16384
              extra_body:
                chat_template_kwargs:
                  enable_thinking: false
# The config of the generated-task recipe's two stages. Each config is the stage's own, keyed as the stage reads it.
pipeline:
  # The rounds: one generation of tasks each, run through the generator service.
  record2sample:
    config:
      # The next round starts when the last one ends, while fewer than refill_tasks saved tasks wait to train, so
      # generation runs ahead of training.
      jobs_per_round: 0
      refill_tasks: 16
      # The candidates of one generation are checked at the same time.
      validation_concurrency: 16
      generator_url: ${endpoints.generator}
      # 400 rounds of 16 tasks: more than the 300 jobs of a 300 step run.
      rounds: 400
      # Claude Code's runs and the calibration of the variants take longer than the default 1800 s.
      generation_deadline_seconds: 21600
      # The stage requires a description; the generator does not read it.
      description: terminal tasks varied from TMax v1.1 parents
      generator:
        module: recipes.beta.autoenvscaling:AutoEnvScalingGenerator
        config:
          generator_url: ${endpoints.generator}
          state_dir: ${REEF_AUTOENVSCALING_STATE_DIR}/generations
          # The seed pool. Uploaded as train tasks instead, the seeds would train ahead of every generated task.
          seed_tasks_path: ${REEF_AUTOENVSCALING_SEEDS_PATH}
          count: 16
          # A task is in the band when the Reasoning Agent passes a quarter to three quarters of its rollouts.
          band_low: 0.25
          band_high: 0.75
          # A seed outside the band becomes a parent that a later generation varies; seeds need it.
          adaptive: true
          # At most half of a generation's slots go to variants; unused seeds fill the rest.
          variant_share: 0.5
          # The Designer: Claude Code on Opus in an E2B sandbox, signed in with CLAUDE_CODE_OAUTH_TOKEN.
          designer: agent
          designer_harness: claude-code
          claude_model: opus
          # Six Designer runs at once, each in its own sandbox.
          concurrency: 6
          # Required, and unused here: Claude Code calls Anthropic itself, seeds have no session, and the review is off.
          agent_model: Qwen3.5-9B
          agent_reef_url: http://127.0.0.1:8900
          # The review would ask agent_model, the policy here, to judge the tests; seeds get no review either way.
          review: "off"
          # Solver-Guided Calibration with upstream's band and rollout counts: keep a variant only when the current
          # policy solves it sometimes. A refused variant is not sent back for revision, as upstream does.
          calibration: refuse
  # One task job holds up to buffer_size saved tasks: one Slime rollout, one optimizer step.
  sample2job:
    config:
      buffer_size: 16
training:
  backend: slime
  ready-timeout: 3600
  config:
    checkpoint_dir: ${REEF_AUTOENVSCALING_STATE_DIR}/checkpoints
  options:
    # Keep only the latest Megatron checkpoints. One is about 135 GB with the optimizer state; the run held three at once.
    reef-checkpoint-policy: latest
    megatron-to-hf-mode: bridge
    hf-checkpoint: ${inference.model-path}
    load: ${training.config.checkpoint_dir}/megatron
    save-interval: "1"
    save: ${training.config.checkpoint_dir}/megatron
    save-hf: ${training.config.checkpoint_dir}/hf/{rollout_id}
    num-rollout: "100000000"
    # One Slime rollout per job: 16 tasks x 16 rollouts, trained as one optimizer step.
    rollout-batch-size: "16"
    n-samples-per-prompt: "16"
    global-batch-size: "256"
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "4"
    num-gpus-per-node: "8"
    rollout-num-gpus: "3"
    rollout-num-gpus-per-engine: "1"
    sglang-router-port: "31200"
    sglang-mem-fraction-static: "0.8"
    sglang-attention-backend: flashinfer
    # Parallelism, recompute, packing and numerics from Slime's own Qwen3.5-9B example
    # (examples/fully_async/run-qwen3.5-9B-fully_async.sh at the pinned Slime): TP2 with sequence parallelism, CP2.
    tensor-model-parallel-size: "2"
    sequence-parallel: true
    context-parallel-size: "2"
    pipeline-model-parallel-size: "1"
    attention-dropout: "0.0"
    hidden-dropout: "0.0"
    accumulate-allreduce-grads-in-fp32: true
    attention-softmax-in-fp32: true
    attention-backend: flash
    seq-length: "66560"
    rollout-max-response-len: "16384"
    rollout-max-context-len: "65536"
    # The rollout engines serve the same 64K window; without it they serve 262144, and a longer sample runs the trainer
    # out of memory (its logits and their gradient are about 17 GiB per GPU at 75K tokens), as does a 64K sample without
    # expandable segments.
    sglang-context-length: "65536"
    rollout-temperature: "1.0"
    # The Qwen3.5-9B model: Slime's spec and the model's shape.
    spec:
      - slime_plugins.models.qwen3_5
      - get_qwen3_5_spec
    disable-bias-linear: true
    qk-layernorm: true
    group-query-attention: true
    num-attention-heads: "16"
    num-query-groups: "4"
    kv-channels: "256"
    num-layers: "32"
    hidden-size: "4096"
    ffn-hidden-size: "12288"
    use-gated-attention: true
    attention-output-gate: true
    normalization: RMSNorm
    apply-layernorm-1p: true
    position-embedding-type: rope
    norm-epsilon: 1e-6
    rotary-percent: "0.25"
    rotary-base: "10000000"
    swiglu: true
    untie-embeddings-and-output-weights: true
    vocab-size: "248320"
    recompute-granularity: full
    recompute-method: uniform
    recompute-num-layers: "1"
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "4096"
    log-probs-chunk-size: "1024"
    use-distributed-optimizer: true
    # The official AutoEnvScaling optimizer: constant lr 1e-6, weight decay 0.1, gradient clip 1.0, no KL.
    optimizer: adam
    optimizer-cpu-offload: true
    overlap-cpu-optimizer-d2h-h2d: true
    use-precision-aware-optimizer: true
    lr: 1e-6
    min-lr: 1e-6
    lr-decay-style: constant
    weight-decay: "0.1"
    clip-grad: "1.0"
    adam-beta1: "0.9"
    adam-beta2: "0.98"
    # Each rollout's advantage is its reward minus its task's mean reward (no std division), as on Tinker.
    advantage-estimator: grpo
    disable-grpo-std-normalization: true
    loss-type: policy_loss
storage:
  artifact-repository: ${REEF_AUTOENVSCALING_STATE_DIR}/artifacts.git
  artifact-work-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/artifact-work
  artifact-cache-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/artifact-cache
  agent-record-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/agent-record
  task-file-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/task-files
execution:
  training: ray
  rollout: ray
