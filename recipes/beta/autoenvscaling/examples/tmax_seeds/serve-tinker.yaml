# AutoEnvScaling on Tinker from a seed pool: the served model trains on TMax-15K seed tasks, and Claude Code writes a
# harder or simpler variant of each seed the model solves too often or too rarely. The generated-task recipe trains them.
# Supply TINKER_API_KEY, E2B_API_KEY and CLAUDE_CODE_OAUTH_TOKEN (made with `claude setup-token`) through the shell.
# REEF_AUTOENVSCALING_STATE_DIR is where this deployment keeps its state; REEF_AUTOENVSCALING_SEEDS_PATH is the seed
# directory that `python -m recipes.beta.autoenvscaling.tmax` wrote.
reef:
  host: 127.0.0.1
  port: 8900
  token: ${REEF_TOKEN}
  run-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/stack
  # The Tinker runtime downloads tokenizer files and saves the initial checkpoint before /healthz answers.
  ready-timeout: 600
inference:
  model-path: Qwen/Qwen3.5-9B
  # How long Reef's inference route waits for one reply; a reply may be 16384 tokens.
  timeout-s: 1800
# The generator service: checks the seeds and the variants and runs the calibration rollouts, with the harbor command line.
generator:
  tasks-root: ${REEF_AUTOENVSCALING_STATE_DIR}/tasks
  # The checks and the calibration rollouts run in E2B, so the host needs no Docker.
  environment: e2b
  # Calibration rollouts in flight: the first 4 rollouts of a candidate run at once.
  concurrency: 4
  # The agent of the calibration rollouts: the training rollouts' agent, so both measure the same thing.
  agent:
    # A training rollout whose context fills ends and is scored; terminus-2 gives it no reward, which trains as 0.
    import_path: reef.record2sample.generator.terminus:VerifiedTerminus2
    model_name: openai/{model}
    kwargs:
      api_base: "{base_url}/v1"
      # The tasks have no network: on e2b the recorder's install hangs the rollout.
      record_terminal_session: false
      # No compaction, as the official AutoEnvScaling solver: a summarized history does not assemble into one sample.
      enable_summarize: false
      # Only the limit Harbor names to the model after a cut reply; on chat completions it caps nothing.
      model_info: {max_input_tokens: 48000, max_output_tokens: 16384, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
      llm_kwargs:
        api_key: "{api_key}"
        # The cap of one reply, as the official solver; before #1110, Reef's Tinker chat route gives 1024 tokens.
        max_tokens: 16384
        # Thinking off: a thinking model's rollout trains only its last turn.
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
recipe:
  implementation: reef.recipe.generated_tasks:GeneratedTaskRecipe
  config:
    job_parameters:
      # The method that trains the rollouts: each rollout's reward minus its task's mean reward (recipes/task_group).
      objective: recipes.task_group.tinker:TaskGroupTinkerObjective
      # Tinker's own rollout of each task job: the rollouts run on Tinker's sampler at the job's start weights.
      rollout:
        # The training rollouts of each task form one group.
        rollouts_per_task: 8
        # Each rollout runs in its own E2B sandbox.
        concurrency: 8
        environment: e2b
        # Qwen3.5 with thinking off ends each generation prompt with an empty think block the history drops.
        scaffold_tolerance: 8
        # The Reasoning Agent: the same agent as generator.agent.
        agent:
          import_path: reef.record2sample.generator.terminus:VerifiedTerminus2
          model_name: openai/{model}
          kwargs:
            api_base: "{base_url}/v1"
            record_terminal_session: false
            enable_summarize: false
            model_info: {max_input_tokens: 48000, max_output_tokens: 16384, input_cost_per_token: 0.0, output_cost_per_token: 0.0}
            llm_kwargs:
              api_key: "{api_key}"
              max_tokens: 16384
              extra_body:
                chat_template_kwargs:
                  enable_thinking: false
# The config of the generated-task recipe's two stages. Each config is the stage's own, keyed as the stage reads it.
pipeline:
  # The rounds: one generation of tasks each, run through the generator service.
  record2sample:
    config:
      # One generation fills one job (count 8, buffer_size 8), so each round follows one trained job.
      jobs_per_round: 1
      generator_url: ${endpoints.generator}
      # 8 rounds of 8 tasks take at most 64 seeds.
      rounds: 8
      # A generation with 4 variants took about 93 minutes: about 20 for Claude Code, the rest for their calibration.
      generation_deadline_seconds: 21600
      # The stage requires a description; the generator does not read it.
      description: terminal tasks from TMax-15K seeds and their variants
      generator:
        module: recipes.beta.autoenvscaling:AutoEnvScalingGenerator
        config:
          generator_url: ${endpoints.generator}
          state_dir: ${REEF_AUTOENVSCALING_STATE_DIR}/generations
          # The seed pool. Uploaded as train tasks instead, the seeds would train ahead of every generated task.
          seed_tasks_path: ${REEF_AUTOENVSCALING_SEEDS_PATH}
          count: 8
          # A task is in the band when the Reasoning Agent passes a quarter to three quarters of its rollouts.
          band_low: 0.25
          band_high: 0.75
          # A seed outside the band becomes a parent that a later generation varies; seeds need it.
          adaptive: true
          # At most half of a generation's slots go to variants; unused seeds fill the rest.
          variant_share: 0.5
          # The Designer: Claude Code on Opus in an E2B sandbox, signed in with CLAUDE_CODE_OAUTH_TOKEN.
          designer: agent
          designer_harness: claude-code
          claude_model: opus
          # Four Designer runs at once, each in its own sandbox; the calibration checks one candidate at a time.
          concurrency: 4
          # Required, and unused here: Claude Code calls Anthropic itself, seeds have no session, and the review is off.
          agent_model: Qwen/Qwen3.5-9B
          agent_reef_url: http://127.0.0.1:8900
          # The review would ask agent_model, the policy here, to judge the tests; seeds get no review either way.
          review: "off"
          # Solver-Guided Calibration with upstream's band and rollout counts: keep a variant only when the current
          # policy solves it sometimes. A refused variant is not sent back for revision, as upstream does.
          calibration: refuse
  # One task job holds up to buffer_size saved tasks; Tinker rolls them out and trains on their task groups.
  sample2job:
    config:
      buffer_size: 8
training:
  backend: tinker
  ready-timeout: 1800
  # One training call to Tinker takes a step of up to 64 multi-turn rollouts.
  timeout-s: 3600
  options:
    state-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/tinker
    # Rollouts in one optimizer step: a whole job of 8 tasks with 8 rollouts each, so one step per job.
    batch-size: 64
    lora-rank: 32
    # The rate of the seed-pool run on 2026-11-04.
    learning-rate: 0.00001
storage:
  artifact-repository: ${REEF_AUTOENVSCALING_STATE_DIR}/artifacts.git
  artifact-work-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/artifact-work
  artifact-cache-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/artifact-cache
  agent-record-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/agent-record
  task-file-dir: ${REEF_AUTOENVSCALING_STATE_DIR}/task-files
