version = "1.0"

[metadata]
author_name = "Reef"
benchmark = "sft-skill-stream"
difficulty = "hard"
category = "continual-learning"
tags = ["reef", "harbor", "sft", "science"]

[verifier]
# The verifier asks the judge for the final result; no scoring runs here.
timeout_sec = 600.0

[agent]
# A stage is two epochs of training steps through Reef, each with a
# checkpoint save; the harness runs it as one exec inside this container.
timeout_sec = 172800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 4096
gpus = 0
