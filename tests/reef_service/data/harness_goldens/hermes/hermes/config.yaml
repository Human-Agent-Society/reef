agent:
  max_turns: 40
auxiliary:
  title_generation:
    enabled: false
curator:
  enabled: false
memory:
  nudge_interval: 0
plugins:
  enabled:
  - tracer
  entries:
    tracer:
      granted_capabilities:
      - tools.override
security:
  tirith_enabled: false
sessions:
  write_json_snapshots: true
skills:
  creation_nudge_interval: 0
  external_dirs:
  - ${HERMES_HOME}/../hermes-commands
  - ${REEF_HARNESS_DEST}/hermes-commands
