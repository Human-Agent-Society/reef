# Installed-wheel smoke config: Reef proxies to a deliberately unreachable
# provider, but startup and /healthz need only the core distribution.
run_dir: .reef/run

reef:
  host: 127.0.0.1
  port: 18900
  recipe: recipe
  token: package-smoke
  upstream_url: https://example.invalid
  upstream_model: package-smoke
  process:
    ready_timeout: 30
  artifact_repository: .reef/artifacts.git
  artifact_work_dir: .reef/artifact-work
  artifact_cache_dir: .reef/artifact-cache
  agent_record_dir: .reef/agent-record
